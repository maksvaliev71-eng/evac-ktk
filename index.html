async function doSetup(){
  const name = document.getElementById("su_name").value.trim(), login = document.getElementById("su_login").value.trim();
  const p1 = document.getElementById("su_pw").value, p2 = document.getElementById("su_pw2").value;
  if (!login || login.length > 40) return renderAuth("setup","Введите логин (до 40 знаков).");
  if (p1.length < 6) return renderAuth("setup","Пароль короче 6 знаков.");
  if (p1 !== p2) return renderAuth("setup","Пароли не совпадают.");
  if (ONLINE.server) {
    try { const r = await api("POST","/api/setup",{login,name:name||login,password:p1}); return serverEnter(r.me); }
    catch(e){ return renderAuth("setup",(e&&e.message)||"Ошибка"); }
  }
  try {
    const id = loginId(login), u = await makeUser(login, name||login, "admin", p1);
    await ONLINE.db.doc("auth/"+id).set(u);
    if (!ONLINE.remote.meta) {
      const cur = docsFromState();
      for (const k of Object.keys(cur)) { await ONLINE.db.doc("app/"+k).set(cur[k]); ONLINE.synced[k] = canon(cur[k]); ONLINE.remote[k] = cur[k]; }
    }
    ONLINE.users[id] = u;
    enterApp(id, u, true);
  } catch(e) { renderAuth("setup","Не удалось сохранить: "+((e&&e.message)||e)); }
}
async function doLogin(){
  const dept = document.getElementById("lg_dept").value;
  const login = document.getElementById("lg_login").value.trim();
  const pw = document.getElementById("lg_pw").value;
  const rem = document.getElementById("lg_rem").checked;
  const fail = ()=> setTimeout(()=>renderAuth("login","Неверный логин, пароль или департамент."), 500);
  if (!login || !pw) return renderAuth("login","Введите логин и пароль.");
  if (ONLINE.server) {
    try { const r = await api("POST","/api/login",{dept,login,password:pw,remember:rem}); return serverEnter(r.me); }
    catch(e){ return setTimeout(()=>renderAuth("login",(e&&e.message)||"Ошибка входа"),300); }
  }
  const id = loginId(login), u = ONLINE.users[id];
  if (!u) return fail();
  let h; try { h = await hashPw(pw, u.salt, u.iter||150000); } catch(e){ return renderAuth("login","Браузер не поддерживает проверку пароля."); }
  if (h !== u.hash || u.dept !== dept) return fail();
  enterApp(id, u, rem);
}
function enterApp(id, u, remember){
  ONLINE.me = { id, login:u.login, name:u.name, dept:u.dept, hash:u.hash };
  ONLINE.isAdmin = (u.dept === "admin");
  ONLINE.ready = true;
  if (remember && !ONLINE.server) { try { localStorage.setItem("evac_sess", JSON.stringify({ id, hash:u.hash })); } catch(e){} }
  authRoot().style.display = "none";
  try { window.evacVp && window.evacVp(true); } catch(e){}
  if (ONLINE.isAdmin && !ONLINE.unsubLog) { if (ONLINE.server) { ONLINE.unsubLog = ()=>{}; refreshServerLog(); } else ONLINE.unsubLog = ONLINE.db.collection("log").onSnapshot(onLogSnap, ()=>{}); }
  if (!ONLINE.isAdmin && state.tab==="admin") state.tab = "dashboard";
  ONLINE.myLog = ((ONLINE.logs.length ? [] : [])).slice();
  loadMyLog();
  setUserChip(); render();
}
async function loadMyLog(){
  if (ONLINE.server) return;
  try { const s = await ONLINE.db.doc("log/"+ONLINE.me.id).get(); ONLINE.myLog = (s.exists && s.data().entries) ? clone(s.data().entries) : []; } catch(e){}
}
function logoutUser(msg){
  try { localStorage.removeItem("evac_sess"); } catch(e){}
  if (ONLINE.server) { try { fetch("/api/logout",{method:"POST"}); } catch(e){} }
  ONLINE.me = null; ONLINE.isAdmin = false; ONLINE.ready = false;
  if (ONLINE.unsubLog) { ONLINE.unsubLog(); ONLINE.unsubLog = null; }
  renderAuth("login", msg||"");
}
function setUserChip(){
  const el = document.getElementById("userChip"); if (!el) return;
  if (!ONLINE.me) { el.textContent = ""; return; }
  const d = deptLabel(ONLINE.me.dept);
  el.textContent = ONLINE.me.name + " · " + d;
  setSyncChip();
}
function setSyncChip(){
  const el = document.getElementById("syncChip"); if (!el) return;
  el.textContent = ONLINE.pending.size ? "сохранение…" : "сохранено";
}
function bootCheck(){
  if (ONLINE.booted || !ONLINE.gotApp || !ONLINE.gotAuth) return;
  ONLINE.booted = true;
  const ids = Object.keys(ONLINE.users);
  if (!ids.length) {
    (async ()=>{
      let ok = false; try { ok = (await ONLINE.user.isOwner()) || (await ONLINE.user.canEdit()); } catch(e){}
      renderAuth(ok ? "setup" : "setup-wait");
    })();
    return;
  }
  try {
    const s = JSON.parse(localStorage.getItem("evac_sess")||"null");
    if (s && ONLINE.users[s.id] && ONLINE.users[s.id].hash === s.hash) { enterApp(s.id, ONLINE.users[s.id], true); return; }
  } catch(e){}
  renderAuth("login");
}

// ---------- ограничения на экране ----------
function areaOfKey(k){
  let m;
  if (/^(res20|res40|norm20|norm40|acc|rep|days)-/.test(k)) return "inputs";
  if (/^(imp20|imp40|impf20|impf40)-/.test(k)) return "import";
  if ((m = k.match(/^plan(?:20|40)-[a-z]+-(\w+)$/))) return "plan_"+m[1];
  if ((m = k.match(/^fact(?:20|40)-[a-z]+-(\w+)$/))) return "fact_"+m[1];
  if (/^dshare-/.test(k)) return "shares";
  if (/^(rplan|rfact|rteu|rs20|rs40)-/.test(k)) return "routes";
  if (/^(horizon|teuov)-/.test(k)) return "trainsCfg";
  if (/^fin-/.test(k)) return "forecast";
  if (/^aedit/.test(k)) return "archive";
  return null;
}
const BTN_AREAS = { toggleRouteLimit:"routes", toggleCapacityDept:"trainsCfg", applyComputedNorm:"inputs", closeMonth:"meta", toggleArchiveEdit:"archive" };
function applyPerms(){
  if (!ONLINE.me) return;
  document.querySelectorAll("#content input[data-key]").forEach(el=>{
    const a = areaOfKey(el.getAttribute("data-key"));
    if (a && !canWriteArea(a)) { el.disabled = true; const w = el.closest(".numfield"); if (w) w.classList.add("ro"); }
  });
  document.querySelectorAll("#content button[onclick]").forEach(el=>{
    const m = (el.getAttribute("onclick")||"").match(/^(?:event\.stopPropagation\(\);\s*)?([A-Za-z]+)\(/);
    const a = m && BTN_AREAS[m[1]];
    if (a && !canWriteArea(a)) { if (a==="meta"||a==="archive") el.hidden = true; else { el.disabled = true; el.classList.add("ro"); } }
  });
}

// ---------- админ-панель ----------
function fmtTime(t){ const d = new Date(t); return d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
function deptLabel(k){ if (k==="admin") return "Администратор"; if (k==="viewer") return VIEWER.label; return (DEPTS.find(d=>d.key===k)||{label:k}).label; }
function renderAdminTab(){
  if (!ONLINE.isAdmin) return "";
  const users = Object.keys(ONLINE.users).map(id=>({id, ...ONLINE.users[id]})).sort((a,b)=>(a.dept==="admin"?0:1)-(b.dept==="admin"?0:1) || a.name.localeCompare(b.name,"ru"));
  const urows = users.map(u=>{
    let act;
    if (ONLINE.pwEdit===u.id) act = '<input class="fld fld-sm" id="pw_new" type="password" placeholder="Новый пароль" autocomplete="new-password"> <button class="btn btn-primary" onclick="adminPwSave(\''+u.id+'\')">Сохранить</button> <button class="btn" onclick="adminPwCancel()">Отмена</button>';
    else {
      act = '<button class="btn" onclick="adminPwStart(\''+u.id+'\')">Сменить пароль</button> ';
      if (u.id !== ONLINE.me.id) act += (ONLINE.delConfirm===u.id)
        ? '<button class="btn btn-danger" onclick="adminDelete(\''+u.id+'\')">Точно удалить</button> <button class="btn" onclick="adminDelCancel()">Отмена</button>'
        : '<button class="btn" onclick="adminDelAsk(\''+u.id+'\')">Удалить</button>';
    }
    return '<tr><td class="loc-name">'+esc(u.name)+'</td><td>'+esc(u.login)+'</td><td>'+esc(deptLabel(u.dept))+'</td><td>'+act+'</td></tr>';
  }).join("");
  const addForm = '<div class="adm-form">'+
    '<div><label class="auth-l" for="nu_name">Имя</label><input class="fld" id="nu_name" autocomplete="off"></div>'+
    '<div><label class="auth-l" for="nu_login">Логин</label><input class="fld" id="nu_login" autocomplete="off"></div>'+
    '<div><label class="auth-l" for="nu_dept">Департамент</label><select class="fld" id="nu_dept">'+DEPTS.map(d=>'<option value="'+d.key+'">'+d.label+'</option>').join("")+'<option value="viewer">'+VIEWER.label+'</option><option value="admin">Администратор</option></select></div>'+
    '<div><label class="auth-l" for="nu_pw">Пароль</label><input class="fld" id="nu_pw" type="password" autocomplete="new-password"></div>'+
    '<div class="adm-form-btn"><button class="btn btn-primary" onclick="adminAddUser()">Создать</button></div></div>';
  const head = DEPTS.map(d=>'<th>'+d.label+'</th>').join("");
  const prow = AREAS.map(a=>'<tr><td>'+esc(a.label)+'</td>'+DEPTS.map(d=>{
    const on = permsFor(d.key).includes(a.id);
    return '<td style="text-align:center"><input type="checkbox" '+(on?"checked":"")+' onchange="adminTogglePerm(\''+d.key+'\',\''+a.id+'\',this.checked)"></td>';
  }).join("")+'</tr>').join("");
  const lrows = ONLINE.logs.length ? ONLINE.logs.map(e=>'<tr><td>'+fmtTime(e.t)+'</td><td>'+esc(e.n)+'</td><td>'+esc(deptLabel(e.d))+'</td><td>'+esc((e.a||[]).join(", "))+'</td></tr>').join("")
    : '<tr><td colspan="4" class="muted">Изменений пока нет.</td></tr>';
  const imp = ONLINE.importState
    ? '<div class="adm-warn">Файл прочитан. Все текущие данные в общей базе будут заменены данными из файла. <button class="btn btn-danger" onclick="adminImportGo()">Да, заменить</button> <button class="btn" onclick="adminImportCancel()">Отмена</button></div>' : '';
  return '<div class="panel"><p class="panel-title">Пользователи</p>'+
      expl('Здесь вы заводите логины и пароли для коллег и привязываете их к департаменту.','Пользователь выбирает свой департамент при входе, затем вводит логин и пароль. Пароль хранится только в зашифрованном виде. Забытый пароль заменяется кнопкой «Сменить пароль».')+
      '<div class="adm-msg">'+esc(ONLINE.adminMsg)+'</div>'+
      '<table><thead><tr><th>Имя</th><th>Логин</th><th>Департамент</th><th>Действия</th></tr></thead><tbody>'+urows+'</tbody></table>'+addForm+'</div>'+
    '<div class="panel"><p class="panel-title">Права департаментов</p>'+
      expl('Что каждый департамент может вносить. Всё остальное он только видит.','Отметка в клетке даёт право менять эту часть данных. Администратор (вы) меняет всё, включая закрытие месяца и редактирование прошлых месяцев, их нельзя выдать никому.')+
      '<div style="overflow-x:auto"><table><thead><tr><th>Что вносится</th>'+head+'</tr></thead><tbody>'+prow+'</tbody></table></div></div>'+
    '<div class="panel"><p class="panel-title">Журнал изменений</p>'+
      expl('Кто и когда менял данные.','Показаны последние записи. Одна запись означает сохранённую серию правок в одной части данных.')+
      '<div style="overflow-x:auto"><table><thead><tr><th>Когда</th><th>Кто</th><th>Департамент</th><th>Что менялось</th></tr></thead><tbody>'+lrows+'</tbody></table></div></div>'+
    '<div class="panel"><p class="panel-title">Резервная копия</p>'+
      expl('Скачайте копию всех данных или загрузите данные из старого файла инструмента.','Для переноса данных из прежнего файла в нём нажмите «Экспорт», затем здесь выберите полученный файл JSON.')+
      imp+'<div class="adm-actions"><button class="btn" onclick="adminDownload()">Скачать копию (JSON)</button> '+
      '<label class="btn">Загрузить копию<input type="file" accept="application/json,.json" style="display:none" onchange="adminPickFile(this)"></label></div></div>';
}
function adminMsg(m){ ONLINE.adminMsg = m; render(); }
async function adminAddUser(){
  const name = document.getElementById("nu_name").value.trim(), login = document.getElementById("nu_login").value.trim();
  const dept = document.getElementById("nu_dept").value, pw = document.getElementById("nu_pw").value;
  if (!login || login.length > 40) return adminMsg("Введите логин (до 40 знаков).");
  if (pw.length < 6) return adminMsg("Пароль короче 6 знаков.");
  const id = loginId(login);
  if (ONLINE.users[id]) return adminMsg("Такой логин уже есть.");
  try { if (ONLINE.server) await api("POST","/api/users",{login,name:name||login,dept,password:pw}); else await ONLINE.db.doc("auth/"+id).set(await makeUser(login, name||login, dept, pw)); adminMsg("Пользователь «"+(name||login)+"» создан."); }
  catch(e){ adminMsg("Не удалось создать: "+((e&&e.message)||e)); }
}
function adminPwStart(id){ ONLINE.pwEdit = id; render(); }
function adminPwCancel(){ ONLINE.pwEdit = null; render(); }
async function adminPwSave(id){
  const pw = document.getElementById("pw_new").value;
  if (pw.length < 6) return adminMsg("Пароль короче 6 знаков.");
  const u = ONLINE.users[id]; if (!u) return;
  try {
    if (ONLINE.server) { await api("PUT","/api/users/"+id,{password:pw}); ONLINE.pwEdit = null; return adminMsg("Пароль изменён."); }
    const salt = randHex(16), iter = 150000, hash = await hashPw(pw, salt, iter);
    await ONLINE.db.doc("auth/"+id).set(Object.assign({}, u, { salt, iter, hash }));
    ONLINE.pwEdit = null;
    if (id === ONLINE.me.id) { ONLINE.me.hash = hash; try { localStorage.setItem("evac_sess", JSON.stringify({ id, hash })); } catch(e){} }
    adminMsg("Пароль изменён.");
  } catch(e){ adminMsg("Не удалось изменить пароль: "+((e&&e.message)||e)); }
}
function adminDelAsk(id){ ONLINE.delConfirm = id; render(); }
function adminDelCancel(){ ONLINE.delConfirm = null; render(); }
async function adminDelete(id){
  try { if (ONLINE.server) await api("DELETE","/api/users/"+id); else await ONLINE.db.doc("auth/"+id).delete(); ONLINE.delConfirm = null; adminMsg("Пользователь удалён."); }
  catch(e){ adminMsg("Не удалось удалить: "+((e&&e.message)||e)); }
}
async function adminTogglePerm(dept, area, on){
  const map = {}; DEPTS.forEach(d=>{ map[d.key] = permsFor(d.key).slice(); });
  const set = new Set(map[dept]); if (on) set.add(area); else set.delete(area); map[dept] = [...set];
  try { if (ONLINE.server) await api("PUT","/api/perms",{map}); else await ONLINE.db.doc("cfg/perms").set({ map }); } catch(e){ adminMsg("Не удалось сохранить права: "+((e&&e.message)||e)); }
}
async function adminDownload(){
  try {
    const d = new Date(), stamp = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (!ONLINE.downloads) return adminMsg("Скачивание недоступно в этом окне.");
    await ONLINE.downloads.save({ filename:"evac-tool-backup-"+stamp+".json", data: JSON.stringify(state, null, 2) });
  } catch(e){ adminMsg("Скачивание отменено или недоступно."); }
}
function adminPickFile(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = function(e){
    try { const p = JSON.parse(e.target.result); if (!p || typeof p!=="object" || !p.inputs) throw 0; ONLINE.importState = p; adminMsg(""); }
    catch(err){ adminMsg("Не удалось прочитать файл. Нужен JSON, полученный кнопкой «Экспорт» в старом инструменте."); }
    inp.value = "";
  };
  r.readAsText(f);
}
function adminImportCancel(){ ONLINE.importState = null; render(); }
function adminImportGo(){
  const p = ONLINE.importState; ONLINE.importState = null; if (!p) return;
  delete p.tab;
  state = Object.assign(state, p);
  migrateState();
  pushAll();
  adminMsg("Данные из файла загружены и сохраняются в общую базу.");
}

// ---------- режим собственного сервера ----------
async function api(method, url, body){
  const r = await fetch(url, { method, headers: body ? {"Content-Type":"application/json"} : {}, body: body ? JSON.stringify(body) : undefined, credentials:"same-origin" });
  let j = {}; try { j = await r.json(); } catch(e){}
  if (r.status === 401 && ONLINE.me) { logoutUser("Сессия закончилась. Войдите заново."); }
  if (!r.ok) throw new Error(j.error || ("Ошибка "+r.status));
  return j;
}
const srvCache = { app:{}, users:{}, perms:null };
function deliverApp(){ onAppSnap({ docs: Object.keys(srvCache.app).map(id=>({ id, data:()=>srvCache.app[id] })) }); }
function deliverUsers(){ onAuthSnap({ docs: Object.keys(srvCache.users).map(id=>({ id, data:()=>srvCache.users[id] })) }); }
async function refreshServerLog(){
  try { const r = await api("GET","/api/log"); ONLINE.logs = (r.entries||[]).map(e=>({ t:e.t, n:e.n, d:e.d, a:(e.a||[]).map(areaLabel) })); if (ONLINE.isAdmin && state.tab==="admin") scheduleRender(); } catch(e){}
}
function makeHttpDb(){
  return {
    doc(path){ const id = path.split("/")[1]; return {
      set:(d)=>api("PUT","/api/app/"+id,d),
      delete:()=>api("DELETE","/api/app/"+id),
      get:async()=>({exists:false,data:()=>undefined}) }; },
    collection(){ return { onSnapshot(){ return ()=>{}; } }; }
  };
}
async function serverStart(){
  const a = await api("GET","/api/app"); srvCache.app = a.docs || {};
  const u = await api("GET","/api/users"); srvCache.users = u.users || {};
  const p = await api("GET","/api/perms"); srvCache.perms = p.map;
  ONLINE.booted = true; ONLINE.gotApp = true; ONLINE.gotAuth = true;
  onPermsSnap({ exists: !!srvCache.perms, data:()=>({ map: srvCache.perms }) });
  deliverUsers(); deliverApp();
  if (!ONLINE.es) {
    const es = new EventSource("/api/events"); ONLINE.es = es;
    es.addEventListener("app", ev=>{ const m = JSON.parse(ev.data); if (m.data) srvCache.app[m.id] = m.data; else delete srvCache.app[m.id]; deliverApp(); });
    es.addEventListener("users", async ()=>{ try { const r = await api("GET","/api/users"); srvCache.users = r.users||{}; deliverUsers(); } catch(e){} });
    es.addEventListener("perms", async ()=>{ try { const r = await api("GET","/api/perms"); srvCache.perms = r.map; onPermsSnap({ exists: !!r.map, data:()=>({ map: r.map }) }); } catch(e){} });
    es.addEventListener("log", ()=>{ if (ONLINE.isAdmin) refreshServerLog(); });
    es.onerror = ()=>{ /* браузер переподключится сам */ };
    es.onopen = async ()=>{ if (ONLINE.me) { try { const a2 = await api("GET","/api/app"); srvCache.app = a2.docs||{}; deliverApp(); } catch(e){} } };
  }
}
async function serverEnter(me){
  try {
    await serverStart();
    enterApp(me.id, me, false);
    if (me.dept === "admin" && !ONLINE.remote.meta) {
      const cur = docsFromState();
      for (const k of Object.keys(cur)) { await api("PUT","/api/app/"+k,cur[k]); ONLINE.synced[k] = canon(cur[k]); ONLINE.remote[k] = cur[k]; }
    }
  } catch(e) { renderAuth("login", (e&&e.message)||"Ошибка подключения"); }
}
async function serverBoot(){
  ONLINE.server = true; ONLINE.db = makeHttpDb();
  try {
    const st = await api("GET","/api/status");
    ONLINE.booted = true;
    if (st.me) return serverEnter(st.me);
    renderAuth(st.setup ? "setup" : "login");
  } catch(e) { renderAuth("nodb"); }
}

// ---------- запуск ----------
async function bootOnline(){
  renderAuth("loading");
  if (typeof EVAC_SERVER !== "undefined" && EVAC_SERVER) return serverBoot();
  try {
    ONLINE.db = await window.claude.use("db");
    ONLINE.user = await window.claude.use("user");
    ONLINE.downloads = await window.claude.use("downloads");
  } catch(e) { ONLINE.db = null; }
  if (!ONLINE.db) return renderAuth("nodb");
  try { ONLINE.canWrite = ONLINE.user ? await ONLINE.user.can("data.write") : null; } catch(e){ ONLINE.canWrite = null; }
  const fail = (e)=>renderAuth("nodb");
  ONLINE.db.collection("app").onSnapshot(onAppSnap, fail);
  ONLINE.db.collection("auth").onSnapshot(onAuthSnap, fail);
  ONLINE.db.doc("cfg/perms").onSnapshot(onPermsSnap, ()=>{});
}
bootOnline();

render();
</script></body></html>
