    trainsBlock;
}
// ================= ПРОГНОЗ =================
// взвешенное среднее последних 3 месяцев (20/30/50%) + половина тренда
function forecastRate(vals){
  const v = vals.filter(x=>x!==null && isFinite(x));
  if (!v.length) return null;
  const last = v.slice(-3);
  const W = [0.2,0.3,0.5].slice(-last.length);
  const ws = W.reduce((a,b)=>a+b,0);
  const wavg = last.reduce((a,x,i)=>a+x*W[i],0)/ws;
  let slope = 0;
  if (last.length>=2){
    const n=last.length, mx=(n-1)/2, my=last.reduce((a,b)=>a+b,0)/n;
    let num=0, den=0;
    last.forEach((y,i)=>{ num+=(i-mx)*(y-my); den+=(i-mx)*(i-mx); });
    slope = den ? num/den : 0;
  }
  return { f: Math.max(0, Math.min(1.5, wavg + 0.5*slope)), min: Math.min(...last), max: Math.max(...last), slope, n: last.length };
}
function setForecastView(v){ state.forecastView = v; saveAndRender(); }
function setForecastInflow(locId, sz, v){ state.forecastInflow[locId][sz] = Number(v)||0; saveAndRender(); }

// ---- общие функции прогноза: используются и листом «Прогноз», и сравнением с фактом ----
function fcDsPF(a, dKey, sz){
  let p=0, f=0;
  LOCATIONS.forEach(l=>{ p += finalPlanSizeForCtx(a.inputs,a.plan,l.id,dKey,sz); f += (a.fact[l.id][dKey][sz]||0); });
  return {p,f};
}
// прогноз выполнения по департаментам (в целом и по 20'/40') и по поездам
function fcCore(hist, ly){
  const blend = (f, l)=> (f!==null && l!==null) ? 0.7*f + 0.3*l : f;
  const hT = hist.map(a=>totalsFullCtx(a.inputs,a.plan,a.fact));
  const lyT = ly ? totalsFullCtx(ly.inputs,ly.plan,ly.fact) : null;
  const rows = DIRECTIONS.map(d=>{
    const vals = hT.map(t=> t.planByDir[d.key]>0 ? t.factByDir[d.key]/t.planByDir[d.key] : null);
    const fr = forecastRate(vals);
    const lyRate = lyT && lyT.planByDir[d.key]>0 ? lyT.factByDir[d.key]/lyT.planByDir[d.key] : null;
    const bySz = {};
    ["c20","c40"].forEach(sz=>{
      const v = hist.map(a=>{ const x=fcDsPF(a,d.key,sz); return x.p>0 ? x.f/x.p : null; });
      const frs = forecastRate(v);
      let lys = null; if (ly){ const x=fcDsPF(ly,d.key,sz); lys = x.p>0 ? x.f/x.p : null; }
      bySz[sz] = { vals:v, fr:frs, ly:lys, final: blend(frs?frs.f:null, lys) };
    });
    return { key:d.key, label:d.label, color:d.color, vals, fr, lyRate, final: blend(fr?fr.f:null, lyRate), bySz };
  });
  const tVals = hist.map(a=> (a.routes && a.routesPlan>0) ? a.routesFact/a.routesPlan : null);
  const tFr = forecastRate(tVals);
  const tLy = (ly && ly.routes && ly.routesPlan>0) ? ly.routesFact/ly.routesPlan : null;
  const trainRow = { label:"Поезда (НЗ)", color:"#5F7385", vals:tVals, fr:tFr, lyRate:tLy, final: blend(tFr?tFr.f:null, tLy), bySz:null };
  return { rows, trainRow };
}
// ожидаемое выполнение по локации × департаменту × типоразмеру
function fcLocRate(hist, rows){
  const lastN = hist.slice(-3), W = [0.2,0.3,0.5].slice(-lastN.length);
  const rowByKey = {}; rows.forEach(r=>rowByKey[r.key]=r);
  return (locId, dKey, sz)=>{
    let sp=0, sf=0;
    lastN.forEach((a,i)=>{ sp += W[i]*finalPlanSizeForCtx(a.inputs,a.plan,locId,dKey,sz); sf += W[i]*(a.fact[locId][dKey][sz]||0); });
    const rr = rowByKey[dKey];
    const dr = rr.bySz[sz].final!==null ? rr.bySz[sz].final : rr.final;
    if (sp<=0) return dr;
    const lr = sf/sp;
    return dr===null ? lr : 0.6*lr + 0.4*dr;
  };
}
// прогноз стока на начало следующего месяца (итого по 20'/40')
function fcStartStock(locRate, inputs, plan, fact, inflow){
  const r = {c20:0, c40:0};
  LOCATIONS.forEach(l=>{
    const i = inputs[l.id];
    ["c20","c40"].forEach(sz=>{
      const res = sz==="c20" ? (effRes(i,"c20")) : (effRes(i,"c40"));
      let evac = 0;
      DIRECTIONS.forEach(d=>{
        const pl = finalPlanSizeForCtx(inputs,plan,l.id,d.key,sz);
        const rr = locRate(l.id,d.key,sz);
        const done = fact[l.id][d.key][sz]||0;
        evac += Math.max(done, pl*Math.min(rr===null?0:rr,1));
      });
      r[sz] += Math.max(0, res - evac) + ((inflow && inflow[l.id] && inflow[l.id][sz])||0);
    });
  });
  return r;
}
// фиксация прогноза на следующий месяц — вызывается при закрытии текущего
function snapshotForecast(){
  const hist = state.archive.filter(a=>a.inputs&&a.plan&&a.fact);
  if (!hist.length) return;
  const cur = state.monthCursor % 12;
  const tIdx = (cur+1)%12, tYear = state.currentYear + (cur===11?1:0);
  const ly = state.archive.find(a=>a.monthIndex===tIdx && a.year===tYear-1 && a.inputs && a.plan && a.fact);
  const core = fcCore(hist, ly);
  const lr = fcLocRate(hist, core.rows);
  const depts = {};
  core.rows.forEach(r=>{ depts[r.key] = { total:r.final, c20:r.bySz.c20.final, c40:r.bySz.c40.final }; });
  if (!state.forecastLog) state.forecastLog = [];
  state.forecastLog = state.forecastLog.filter(x=>!(x.targetIdx===tIdx && x.targetYear===tYear));
  state.forecastLog.push({ targetIdx:tIdx, targetYear:tYear, madeIn: MONTH_NAMES[cur],
    depts, trains: core.trainRow.final, stock: fcStartStock(lr, state.inputs, state.plan, state.fact, state.forecastInflow),
    basis: hist.length });
}

// ---- сравнение прогноза с фактом ----
function fcActual(a){
  const t = totalsFullCtx(a.inputs,a.plan,a.fact);
  const depts = {};
  DIRECTIONS.forEach(d=>{
    const x20 = fcDsPF(a,d.key,'c20'), x40 = fcDsPF(a,d.key,'c40');
    depts[d.key] = { total: t.planByDir[d.key]>0 ? t.factByDir[d.key]/t.planByDir[d.key] : null,
                     c20: x20.p>0 ? x20.f/x20.p : null, c40: x40.p>0 ? x40.f/x40.p : null };
  });
  const stock = { c20: LOCATIONS.reduce((s,l)=>s+(effRes(a.inputs[l.id],"c20")),0), c40: LOCATIONS.reduce((s,l)=>s+(effRes(a.inputs[l.id],"c40")),0) };
  return { depts, trains: (a.routes && a.routesPlan>0) ? a.routesFact/a.routesPlan : null, stock };
}
function forecastAccuracyItems(){
  const arc = state.archive, items = [];
  arc.forEach((a,k)=>{
    if (!(a.inputs&&a.plan&&a.fact)) return;
    let fc = (state.forecastLog||[]).find(x=>x.targetIdx===a.monthIndex && x.targetYear===a.year);
    let kind = 'fixed';
    if (!fc) {
      // ретро: что модель показала бы, пока шёл предыдущий месяц (по месяцам до него)
      const hist = arc.slice(0, Math.max(0,k-1)).filter(x=>x.inputs&&x.plan&&x.fact);
      if (!hist.length) return;
      const ly = arc.find(x=>x.monthIndex===a.monthIndex && x.year===a.year-1 && x.inputs&&x.plan&&x.fact);
      const core = fcCore(hist, ly);
      const depts = {}; core.rows.forEach(r=>{ depts[r.key] = { total:r.final, c20:r.bySz.c20.final, c40:r.bySz.c40.final }; });
      fc = { depts, trains: core.trainRow.final, stock: null, basis: hist.length };
      kind = 'retro';
    }
    items.push({ a, fc, act: fcActual(a), kind });
  });
  return items;
}
function renderForecastAccuracy(){
  const items = forecastAccuracyItems();
  if (!items.length) {
    return '<div class="panel" style="border-style:dashed;box-shadow:none"><p class="panel-title">Прогноз и факт</p>'+
      '<p class="panel-sub" style="margin:0">Сравнение появится, когда закроется месяц, на который был прогноз.</p></div>';
  }
  const pp = v=> (v>0?'+':'')+Math.round(v*100);
  const devStyle = dv=> Math.abs(dv)<=0.05 ? 'color:var(--ok)' : (Math.abs(dv)<=0.10 ? 'color:#8A5A00' : 'color:var(--danger)');
  const cell = (f, x, tip)=>{
    if (f===null||f===undefined||x===null||x===undefined) return '<td class="num-cell muted" style="text-align:center">—</td>';
    const dv = x - f;
    return '<td class="num-cell" style="text-align:center" title="'+tip+'">'+Math.round(f*100)+'% → <b>'+Math.round(x*100)+'%</b>'+
      '<div style="font-size:11.5px;font-weight:700;'+devStyle(dv)+'">'+pp(dv)+' п.п.</div></td>';
  };
  const showTrains = items.some(it=>it.fc.trains!==null && it.act.trains!==null);
  const stats = {}; DIRECTIONS.forEach(d=>stats[d.key]={abs:0,sum:0,n:0}); const tst={abs:0,sum:0,n:0};
  const add = (st,f,x)=>{ if (f===null||f===undefined||x===null||x===undefined) return; const dv=x-f; st.abs+=Math.abs(dv); st.sum+=dv; st.n++; };
  const body = items.map(it=>{
    const cells = DIRECTIONS.map(d=>{
      const f = it.fc.depts[d.key], x = it.act.depts[d.key];
      add(stats[d.key], f.total, x.total);
      const sz = ["c20","c40"].map(z=> (z==="c20"?"20'":"40'")+': '+(f[z]===null?'—':Math.round(f[z]*100)+'%')+' → '+(x[z]===null?'—':Math.round(x[z]*100)+'%')+(f[z]!==null&&x[z]!==null?' ('+pp(x[z]-f[z])+' п.п.)':'')).join(' · ');
      return cell(f.total, x.total, sz);
    }).join("");
    let tc = '';
    if (showTrains) { add(tst, it.fc.trains, it.act.trains); tc = cell(it.fc.trains, it.act.trains, 'поезда (НЗ)'); }
    const badge = it.kind==='fixed'
      ? '<span class="badge badge-ok">зафиксирован</span>'
      : '<span class="badge" style="background:#EEF2F6;color:var(--muted)">ретро-расчёт</span>';
    return '<tr><td class="loc-name">'+it.a.label+' '+it.a.year+'<div style="margin-top:3px">'+badge+' <span class="muted" style="font-size:11px">по '+it.fc.basis+' мес.</span></div></td>'+cells+tc+'</tr>';
  }).join("");
  const sumCell = st=>{
    if (!st.n) return '<td class="num-cell muted" style="text-align:center">—</td>';
    const mae = st.abs/st.n, bias = st.sum/st.n;
    const bt = Math.abs(bias)<0.01 ? 'без смещения' : (bias>0 ? 'факт выше прогноза в среднем на '+Math.round(bias*100)+' п.п.' : 'факт ниже прогноза в среднем на '+Math.round(-bias*100)+' п.п.');
    return '<td class="num-cell" style="text-align:center"><b>±'+Math.round(mae*100)+' п.п.</b><div class="muted" style="font-size:11px;font-weight:500;font-family:Archivo,sans-serif;white-space:normal">'+bt+'</div></td>';
  };
  const foot = '<tr class="total-row"><td>Средняя ошибка</td>'+DIRECTIONS.map(d=>sumCell(stats[d.key])).join("")+(showTrains?sumCell(tst):'')+'</tr>';

  // прогноз стока — только по зафиксированным прогнозам
  const fixed = items.filter(it=>it.kind==='fixed' && it.fc.stock);
  let stockTbl;
  if (fixed.length) {
    const sc = (f,x)=>{ const dv = f>0 ? (x/f-1) : null;
      return '<td class="num-cell" style="text-align:center">'+fmt(f)+' → <b>'+fmt(x)+'</b><div style="font-size:11.5px;font-weight:700;'+(dv===null?'':devStyle(dv))+'">'+(dv===null?'':(dv>0?'+':'')+Math.round(dv*100)+'%')+'</div></td>'; };
    stockTbl = '<p class="panel-title" style="font-size:13px;margin-top:18px">Сток на начало месяца: прогноз → факт</p>'+
      '<table><thead><tr><th>Месяц</th><th style="text-align:center">20\'</th><th style="text-align:center">40\'</th></tr></thead><tbody>'+
      fixed.map(it=>'<tr><td class="loc-name">'+it.a.label+' '+it.a.year+'</td>'+sc(it.fc.stock.c20, it.act.stock.c20)+sc(it.fc.stock.c40, it.act.stock.c40)+'</tr>').join("")+
      '</tbody></table><p class="muted" style="font-size:11.5px;margin:6px 0 0">Если ожидаемый подход не вписывался, прогноз стока будет ниже факта примерно на величину подхода.</p>';
  } else {
    stockTbl = '<p class="muted" style="font-size:12px;margin:14px 0 0">Сравнение прогноза стока появится после первого месяца с зафиксированным прогнозом — для ретро-расчётов его не сделать: тогда не было вписанного ожидаемого подхода.</p>';
  }

  const nFixed = items.filter(it=>it.kind==='fixed').length;
  return '<div class="panel"><p class="panel-title">Прогноз и факт — насколько точен прогноз</p>'+
    '<p class="panel-sub">Выполнение плана: прогноз → факт и отклонение в процентных пунктах. Плюс — вывезли лучше прогноза, минус — хуже. Зелёным до ±5 п.п., жёлтым до ±10, красным больше. «Зафиксирован» — прогноз, сохранённый при закрытии предыдущего месяца, ровно как вы его видели. «Ретро-расчёт» — что модель показала бы тогда по данным, которые были на тот момент. Наведите на ячейку — разбивка по 20\' и 40\'.</p>'+
    '<table><thead><tr><th>Месяц</th>'+DIRECTIONS.map(d=>'<th style="text-align:center"><span class="dot" style="background:'+d.color+';margin-right:5px"></span>'+d.label+'</th>').join("")+(showTrains?'<th style="text-align:center">Поезда (НЗ)</th>':'')+'</tr></thead>'+
    '<tbody>'+body+foot+'</tbody></table>'+stockTbl+
    '<p class="muted" style="font-size:11.5px;margin:10px 0 0">Сравнено месяцев: '+items.length+(nFixed?', из них зафиксированных: '+nFixed:'')+'.</p></div>';
}
function forecastMAE(){
  const items = forecastAccuracyItems(); let abs=0, n=0;
  items.forEach(it=>DIRECTIONS.forEach(d=>{ const f=it.fc.depts[d.key].total, x=it.act.depts[d.key].total; if (f!==null&&f!==undefined&&x!==null&&x!==undefined){ abs+=Math.abs(x-f); n++; } }));
  return n ? { mae: abs/n, months: items.length } : null;
}

function forecastParts(V0){
  const hist = state.archive.filter(a=>a.inputs&&a.plan&&a.fact);
  const cur = state.monthCursor % 12;
  const nIdx = (cur+1)%12, nYear = state.currentYear + (cur===11?1:0);
  const tIdx = V0 ? cur : nIdx, tYear = V0 ? state.currentYear : nYear;
  const tLabel = MONTH_NAMES[tIdx], curLabel = MONTH_NAMES[cur], nLabel = MONTH_NAMES[nIdx];
  if (!hist.length) {
    return { empty: '<div class="panel"><p class="panel-title">Прогноз</p><div class="archive-empty">Для прогноза нужен хотя бы один закрытый месяц в архиве.</div></div>' };
  }
  const ly = state.archive.find(a=>a.monthIndex===tIdx && a.year===tYear-1 && a.inputs && a.plan && a.fact);
  const hT = hist.map(a=>totalsFullCtx(a.inputs,a.plan,a.fact));
  const lyT = ly ? totalsFullCtx(ly.inputs,ly.plan,ly.fact) : null;
  const blend = (f, l)=> (f!==null && l!==null) ? 0.7*f + 0.3*l : f;
  const pctS = v=> v===null||v===undefined ? "—" : Math.round(v*100)+"%";
  const SZ = ["c20","c40"], SZL = {c20:"20'", c40:"40'"};
  const lastN = hist.slice(-3);
  const W = [0.2,0.3,0.5].slice(-lastN.length);

  const dsPF = fcDsPF;
  const _core = fcCore(hist, ly);
  const rows = _core.rows, trainRow = _core.trainRow;
  const tLy = trainRow.lyRate;

  // график — выполнение департаментов в целом, пунктир — прогноз
  const tail = hist.slice(-6), off = hist.length - tail.length;
  // для текущего месяца график продлевается ещё на следующий (со своей поправкой на прошлый год, если она есть)
  const lyN = state.archive.find(a=>a.monthIndex===nIdx && a.year===nYear-1 && a.inputs && a.plan && a.fact);
  const coreN = V0 ? fcCore(hist, lyN) : null;
  const nextFinal = r=>{
    if (!coreN) return null;
    if (!r.bySz) return coreN.trainRow.final;
    const x = coreN.rows.find(q=>q.key===r.key); return x ? x.final : null;
  };
  const fLbls = [tLabel.slice(0,3)+" (прогн.)"].concat(V0 ? [nLabel.slice(0,3)+" (прогн.)"] : []);
  const lbls = tail.map(a=>a.label.slice(0,3)).concat(fLbls);
  const series = [];
  rows.concat(trainRow.fr ? [trainRow] : []).forEach(r=>{
    const hv = r.vals.slice(off);
    series.push({ name:r.label, color:r.color, values: hv.concat(fLbls.map(()=>null)) });
    const fv = hv.map(()=>null).concat(V0 ? [r.final, nextFinal(r)] : [r.final]);
    if (hv.length && hv[hv.length-1]!==null) fv[hv.length-1] = hv[hv.length-1];
    series.push({ name:r.label+" — прогноз", color:r.color, values: fv, dash:true });
  });
  const _w = CH.W; CH.W = 1200; const chart = svgLines(lbls, series, false); CH.W = _w;

  const trendTxt = fr=>{
    if (!fr || fr.n<2) return '<span class="muted">мало данных</span>';
    const pp = fr.slope*100;
    if (Math.abs(pp)<1) return '<span class="muted">→ стабильно</span>';
    return pp>0 ? '<span class="diff-ok">↑ +'+Math.round(pp)+' п.п./мес</span>' : '<span class="diff-bad">↓ '+Math.round(pp)+' п.п./мес</span>';
  };
  const histTip = v=> lastN.map((a,i)=>{ const x=v.slice(-lastN.length)[i]; return a.label.toLowerCase()+' '+pctS(x===undefined?null:x); }).join(' · ');
  const fCell = (x, big)=> '<td class="num-cell" style="text-align:center;font-weight:800;'+(big?'font-size:15px;':'')+heatStyle(x.final)+'" title="'+histTip(x.vals)+'">'+pctS(x.final)+'</td>';
  const curT = totalsFullCtx(state.inputs,state.plan,state.fact);
  const curRt = routesTotals(state.routes);
  const logCur = (state.forecastLog||[]).find(x=>x.targetIdx===cur && x.targetYear===state.currentYear);
  const prevLabel = MONTH_NAMES[(cur+11)%12];
  const extraCells = r=>{
    if (!V0) return '';
    const isTrain = !r.bySz;
    const part = isTrain ? (curRt.plan>0 ? curRt.fact/curRt.plan : null)
                         : (curT.planByDir[r.key]>0 ? curT.factByDir[r.key]/curT.planByDir[r.key] : null);
    const lg = logCur ? (isTrain ? logCur.trains : (logCur.depts[r.key] ? logCur.depts[r.key].total : null)) : null;
    return '<td class="num-cell" style="text-align:center">'+pctS(part)+'</td>'+
           '<td class="num-cell muted" style="text-align:center">'+pctS(lg)+'</td>';
  };
  const fRow = r=>{
    const sizeCells = r.bySz ? SZ.map(sz=>fCell(r.bySz[sz],false)).join("") : '<td class="num-cell muted" style="text-align:center">—</td><td class="num-cell muted" style="text-align:center">—</td>';
    return '<tr><td class="loc-name"><span class="dot" style="background:'+r.color+';margin-right:7px"></span>'+r.label+'</td>'+
      sizeCells + fCell(r,true)+
      '<td class="num-cell muted" style="text-align:center">'+(r.fr ? pctS(r.fr.min)+' – '+pctS(r.fr.max) : '—')+'</td>'+
      '<td>'+trendTxt(r.fr)+'</td>'+
      (ly ? '<td class="num-cell" style="text-align:center">'+pctS(r.lyRate)+'</td>' : '')+extraCells(r)+'</tr>';
  };
  const execPanel = '<div class="panel"><p class="panel-title">Ожидаемое выполнение плана — '+tLabel.toLowerCase()+(V0?' и '+nLabel.toLowerCase():'')+'</p>'+
    '<p class="panel-sub">Взвешенное среднее последних трёх закрытых месяцев (свежий весит больше) с поправкой на тренд'+(ly?' и на тот же месяц прошлого года':'')+', отдельно по 20\' и 40\'. Пунктир на графике — прогноз на текущий и следующий месяц. Наведите на процент — история по месяцам.</p>'+
    chart + chartLegend(rows.concat(trainRow.fr?[trainRow]:[]).map(r=>({name:r.label,color:r.color})))+
    '<table style="margin-top:14px"><thead><tr><th rowspan="2"></th><th colspan="3" style="text-align:center;border-bottom:1px solid var(--border)">Прогноз выполнения</th>'+
    '<th rowspan="2" style="text-align:center">Диапазон</th><th rowspan="2">Тренд</th>'+(ly?'<th rowspan="2" style="text-align:center">'+tLabel+' '+(tYear-1)+'</th>':'')+
    (V0?'<th rowspan="2" style="text-align:center">Вывезено<br>на сегодня</th><th rowspan="2" style="text-align:center">Прогноз,<br>сделанный в '+monthIn(prevLabel)+'</th>':'')+'</tr>'+
    '<tr><th style="text-align:center">20\'</th><th style="text-align:center">40\'</th><th style="text-align:center">Итого</th></tr></thead>'+
    '<tbody>'+rows.map(fRow).join("")+(trainRow.fr ? fRow(trainRow) : '<tr><td class="loc-name">Поезда (НЗ)</td><td colspan="'+(5+(ly?1:0)+(V0?2:0))+'" class="muted">нет истории по поездам — внесите план и факт поездов в архивные месяцы</td></tr>')+'</tbody></table></div>';

  const locRate = fcLocRate(hist, rows);
  // остаток на конец текущего месяца: ресурс (сток + подход текущего месяца, «Ввод данных») − ожидаемый вывоз
  const endOf = (l, sz)=>{
    const i = state.inputs[l.id];
    const res = sz==="c20" ? (effRes(i,"c20")) : (effRes(i,"c40"));
    let evac = 0;
    DIRECTIONS.forEach(d=>{
      const pl = finalPlanSizeForCtx(state.inputs,state.plan,l.id,d.key,sz);
      const r = locRate(l.id,d.key,sz);
      evac += Math.max(state.fact[l.id][d.key][sz]||0, pl*Math.min(r===null?0:r,1));
    });
    return Math.max(0, res - evac);
  };
  // план следующего месяца = его излишек (остаток + подход следующего месяца − норма),
  // разложенный по департаментам в пропорции текущего плана этой локации и типоразмера
  const nextPlan = (l, dKey, sz)=>{
    const i = state.inputs[l.id];
    const norm = sz==="c20" ? (i.norm20||0) : (i.norm40||0);
    const start = endOf(l,sz) + (((state.forecastInflow||{})[l.id]||{})[sz]||0);
    const sur = Math.max(0, start - norm);
    const tot = DIRECTIONS.reduce((a,d)=>a+finalPlanSizeForCtx(state.inputs,state.plan,l.id,d.key,sz),0);
    const mine = finalPlanSizeForCtx(state.inputs,state.plan,l.id,dKey,sz);
    const mix = tot>0 ? mine/tot : (((state.distributionShares||{})[l.id]||{})[dKey]||0)/100;
    return sur*mix;
  };

  // ---- риск недовывоза ----
  const planTotal = V0 ? totalsFullCtx(state.inputs,state.plan,state.fact).totalPlan
                       : LOCATIONS.reduce((a,l)=>a+DIRECTIONS.reduce((b,d)=>b+nextPlan(l,d.key,'c20')+nextPlan(l,d.key,'c40'),0),0);
  let riskPanel, riskSum = null;
  if (planTotal<=0) {
    riskPanel = '<div class="panel"><p class="panel-title">Риск недовывоза — '+tLabel.toLowerCase()+'</p><div class="archive-empty">'+
      (V0 ? 'Внесите план текущего месяца — риск считается от него.' : 'Излишка к эвакуации в '+monthIn(tLabel)+' не ожидается — проверьте ресурс и норму на «Вводе данных» и подход ниже.')+'</div></div>';
  } else {
    const tot = {c20:{p:0,e:0}, c40:{p:0,e:0}};
    const colT = {}; DIRECTIONS.forEach(d=>{ colT[d.key]={c20:{p:0,e:0},c40:{p:0,e:0}}; });
    const locStats = [];
    const body = LOCATIONS.map(l=>{
      const ls = {c20:{p:0,e:0}, c40:{p:0,e:0}};
      const cells = DIRECTIONS.map(d=>SZ.map(sz=>{
        const pl = V0 ? finalPlanSizeForCtx(state.inputs,state.plan,l.id,d.key,sz) : nextPlan(l,d.key,sz);
        const r = locRate(l.id,d.key,sz);
        if (pl<0.5 || r===null) return '<td class="num-cell muted" style="text-align:center">—</td>';
        const done = state.fact[l.id][d.key][sz]||0;
        const exp = V0 ? Math.max(done, pl*Math.min(r,1)) : pl*Math.min(r,1);
        const e = Math.min(pl, exp);
        const shown = V0 ? exp/pl : r;
        ls[sz].p+=pl; ls[sz].e+=e; tot[sz].p+=pl; tot[sz].e+=e; colT[d.key][sz].p+=pl; colT[d.key][sz].e+=e;
        return '<td class="num-cell" style="text-align:center;font-weight:700;'+heatStyle(shown)+'" title="'+SZL[sz]+': план '+fmt(pl)+(V0?' · уже вывезено '+fmt(done):'')+' · ожидаемо вывезут '+fmt(exp)+' · недовывоз '+fmt(pl-e)+'">'+pctS(shown)+'</td>';
      }).join("")).join("");
      const sh20 = ls.c20.p-ls.c20.e, sh40 = ls.c40.p-ls.c40.e;
      const lp = ls.c20.p+ls.c40.p;
      if (lp>0) locStats.push({ name:l.name, s20:sh20, s40:sh40, short:sh20+sh40, r:(ls.c20.e+ls.c40.e)/lp });
      return '<tr><td class="loc-name">'+l.name+'</td>'+cells+
        '<td class="num-cell" style="text-align:right">'+(sh20>=0.5?fmt(sh20):'—')+'</td>'+
        '<td class="num-cell" style="text-align:right">'+(sh40>=0.5?fmt(sh40):'—')+'</td></tr>';
    }).join("");
    const foot = '<tr class="total-row"><td>Итого</td>'+DIRECTIONS.map(d=>SZ.map(sz=>{
      const x = colT[d.key][sz], r = x.p>0 ? x.e/x.p : null;
      return '<td class="num-cell" style="text-align:center;'+heatStyle(r)+'">'+pctS(r)+'</td>';
    }).join("")).join("")+
      '<td class="num-cell" style="text-align:right">'+fmt(tot.c20.p-tot.c20.e)+'</td><td class="num-cell" style="text-align:right">'+fmt(tot.c40.p-tot.c40.e)+'</td></tr>';
    const rate = x=> x.p>0 ? x.e/x.p : null;
    const allP = tot.c20.p+tot.c40.p, allE = tot.c20.e+tot.c40.e;
    const overall = allP>0 ? allE/allP : null;
    const top3 = locStats.filter(x=>x.short>=0.5).sort((a,b)=>b.short-a.short).slice(0,3);
    riskSum = { overall, r20: rate(tot.c20), r40: rate(tot.c40), short: allP-allE, s20: tot.c20.p-tot.c20.e, s40: tot.c40.p-tot.c40.e, plan: allP, top3 };
    const splitLine = (a,b)=> '<div class="dept-kpi-sub" style="margin-top:6px">20\' '+a+' · 40\' '+b+'</div>';
    riskPanel = '<div class="panel"><p class="panel-title">Риск недовывоза — '+tLabel.toLowerCase()+'</p>'+
      '<p class="panel-sub">'+(V0 ? 'При реальном плане '+monthOf(curLabel)+' и с учётом уже внесённого факта: где вывезено больше расчётного, берётся факт.' : 'План '+monthOf(tLabel)+' = его излишек: остаток на конец '+monthOf(curLabel)+' + подход '+monthOf(tLabel)+' − норма, разложенный по департаментам в пропорции текущего плана.')+' Ожидаемое выполнение по каждой локации — по её истории отдельно для 20\' и 40\', сглаженной по департаменту. Топ-3 — локации с наибольшим недовывозом в штуках. Наведите на ячейку — план и недовывоз в штуках.</p>'+
      '<div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">'+
        '<div class="kpi"><div class="kpi-label">Ожидаемое выполнение</div><div class="kpi-value" style="'+(overall!==null&&overall<0.8?'color:var(--danger)':'')+'">'+pctS(overall)+'</div>'+splitLine(pctS(rate(tot.c20)),pctS(rate(tot.c40)))+'</div>'+
        '<div class="kpi"><div class="kpi-label">Ожидаемый недовывоз</div><div class="kpi-value">'+fmt(allP-allE)+' <span style="font-size:14px;font-weight:600;color:var(--muted)">шт</span></div>'+splitLine(fmt(tot.c20.p-tot.c20.e)+' шт', fmt(tot.c40.p-tot.c40.e)+' шт')+'</div>'+
        '<div class="kpi"><div class="kpi-label">Топ-3 локации по риску недовывоза</div>'+
          (top3.length ? '<div class="risk-row risk-head"><span></span><span></span><span>20\'</span><span>40\'</span><span>вып.</span></div>'+top3.map((x,i)=>
            '<div class="risk-row"><span class="risk-n">'+(i+1)+'</span>'+
            '<span class="risk-name">'+x.name+'</span>'+
            '<span class="risk-short">'+fmt(x.s20)+'</span>'+
            '<span class="risk-short">'+fmt(x.s40)+'</span>'+
            '<span class="risk-pct" style="'+heatStyle(x.r)+'">'+pctS(x.r)+'</span></div>').join("")
          : '<div class="dept-kpi-sub">недовывоз не ожидается</div>')+
        '</div>'+
      '</div>'+
      '<table><thead><tr><th rowspan="2">Локация</th>'+DIRECTIONS.map(d=>'<th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)"><span class="dot" style="background:'+d.color+';margin-right:5px"></span>'+d.label+'</th>').join("")+
      '<th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)">Недовывоз, шт</th></tr>'+
      '<tr>'+DIRECTIONS.map(()=>'<th style="text-align:center">20\'</th><th style="text-align:center">40\'</th>').join("")+'<th style="text-align:right">20\'</th><th style="text-align:right">40\'</th></tr></thead>'+
      '<tbody>'+body+foot+'</tbody></table></div>';
  }

  // ---- стартовый сток следующего месяца ----
  const acc = {c20:{start:0,sur:0,inf:0,end:0}, c40:{start:0,sur:0,inf:0,end:0}};
  const sRows = LOCATIONS.map(l=>{
    const i = state.inputs[l.id];
    const cells = {inf:"",start:"",sur:"",end:""};
    SZ.forEach(sz=>{
      const res = sz==="c20" ? (effRes(i,"c20")) : (effRes(i,"c40"));
      const norm = sz==="c20" ? (i.norm20||0) : (i.norm40||0);
      let evac = 0;
      DIRECTIONS.forEach(d=>{
        const pl = finalPlanSizeForCtx(state.inputs,state.plan,l.id,d.key,sz);
        const r = locRate(l.id,d.key,sz);
        const done = state.fact[l.id][d.key][sz]||0;
        evac += Math.max(done, pl*Math.min(r===null?0:r,1));
      });
      const end = Math.max(0, res - evac);
      const inf = state.forecastInflow[l.id][sz]||0;
      const start = end + inf;
      const sur = Math.max(0, start - norm);
      acc[sz].start+=start; acc[sz].sur+=sur; acc[sz].inf+=inf; acc[sz].end+=end;
      cells.end += '<td class="num-cell" style="text-align:center" title="ресурс '+fmt(res)+' − ожидаемый вывоз ~'+fmt(evac)+'">'+fmt(end)+'</td>';
      const h = archHandler('hFI_'+l.id+'_'+sz, v=>setForecastInflow(l.id, sz, v));
      cells.inf += '<td style="text-align:center">'+numField('fin-'+l.id+'-'+sz, inf, h)+'</td>';
      cells.start += '<td class="num-cell" style="text-align:center" title="сток сейчас '+fmt(res)+' − ожидаемый вывоз ~'+fmt(evac)+' + подход '+fmt(inf)+'">'+fmt(start)+'</td>';
      cells.sur += '<td class="num-cell" style="text-align:center;font-weight:700">'+fmt(sur)+'</td>';
    });
    return '<tr><td class="loc-name">'+l.name+'</td>'+cells.end+cells.inf+cells.start+cells.sur+'</tr>';
  }).join("");
  const sFoot = '<tr class="total-row"><td>Итого</td>'+
    SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+fmt(acc[sz].end)+'</td>').join("")+
    SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+fmt(acc[sz].inf)+'</td>').join("")+
    SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+fmt(acc[sz].start)+'</td>').join("")+
    SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+fmt(acc[sz].sur)+'</td>').join("")+'</tr>';
  const grp = t=>'<th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)">'+t+'</th>';
  const sub = '<th style="text-align:center">20\'</th><th style="text-align:center">40\'</th>';
  const stockPanel = '<div class="panel"><p class="panel-title">Сток: конец '+monthOf(curLabel)+' → начало '+monthOf(nLabel)+'</p>'+
    '<p class="panel-sub"><b>Остаток на конец '+monthOf(curLabel)+'</b> = ресурс с «Ввода данных» (сток + подход '+monthOf(curLabel)+') − ожидаемый вывоз. '+
    '<b>Подход '+monthOf(nLabel)+'</b> вносится здесь — это не тот подход, что на «Вводе данных». '+
    '<b>Сток на начало</b> = остаток + подход. <b>Излишек</b> = сток на начало − текущая норма — от него считается план и риск '+monthOf(nLabel)+' выше.</p>'+
    '<table><thead><tr><th rowspan="2">Локация</th>'+grp("Остаток на конец "+monthOf(curLabel))+grp("Подход "+monthOf(nLabel)+" (ввод)")+grp("Сток на начало "+monthOf(nLabel))+grp("Излишек к эвакуации")+'</tr><tr>'+sub+sub+sub+sub+'</tr></thead>'+
    '<tbody>'+sRows+sFoot+'</tbody></table></div>';

  // ---- сравнение с тем же месяцем прошлого года ----
  let yoyPanel;
  if (ly) {
    const resSz = (inp, sz)=> LOCATIONS.reduce((a,l)=>a+(sz==="c20"?(effRes(inp[l.id],"c20")):(effRes(inp[l.id],"c40"))),0);
    const yRows = rows.map(r=>
      '<tr><td class="loc-name"><span class="dot" style="background:'+r.color+';margin-right:7px"></span>'+r.label+'</td>'+
      SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+pctS(r.bySz[sz].ly)+'</td>').join("")+
      SZ.map(sz=>'<td class="num-cell" style="text-align:center;font-weight:800;'+heatStyle(r.bySz[sz].final)+'">'+pctS(r.bySz[sz].final)+'</td>').join("")+'</tr>').join("")+
      (trainRow.fr||tLy!==null ? '<tr><td class="loc-name"><span class="dot" style="background:'+trainRow.color+';margin-right:7px"></span>'+trainRow.label+'</td>'+
        '<td colspan="2" class="num-cell" style="text-align:center">'+pctS(tLy)+'</td><td colspan="2" class="num-cell" style="text-align:center;font-weight:800;'+heatStyle(trainRow.final)+'">'+pctS(trainRow.final)+'</td></tr>' : '');
    const chg = (a,b)=> a>0 ? (b>=a?'+':'')+Math.round((b/a-1)*100)+'%' : '—';
    const sLine = SZ.map(sz=>{ const a=resSz(ly.inputs,sz), b=resSz(state.inputs,sz); return SZL[sz]+': '+fmt(a)+' → '+fmt(b)+' ('+chg(a,b)+')'; }).join(' · ');
    yoyPanel = '<div class="panel"><p class="panel-title">Сравнение с тем же месяцем прошлого года — '+tLabel.toLowerCase()+' '+(tYear-1)+'</p>'+
      '<p class="panel-sub">Итоговый прогноз = 70% по последним месяцам + 30% по тому же месяцу прошлого года — так учитывается сезонность.</p>'+
      '<table><thead><tr><th rowspan="2"></th>'+grp(tLabel+' '+(tYear-1)+' — выполнение')+grp("Итоговый прогноз")+'</tr><tr>'+sub+sub+'</tr></thead><tbody>'+yRows+'</tbody></table>'+
      '<p class="muted" style="font-size:12px;margin:12px 0 0">Сток (сток + подход), год назад → сейчас: '+sLine+'.</p></div>';
  } else {
    yoyPanel = '<div class="panel" style="border-style:dashed;box-shadow:none"><p class="panel-title">Сравнение с прошлым годом</p>'+
      '<p class="panel-sub" style="margin:0">Появится автоматически, когда в архиве будет '+tLabel.toLowerCase()+' '+(tYear-1)+'. Тогда прогноз начнёт учитывать сезонность — отдельно для 20\' и 40\'. Сейчас в архиве: '+
      hist.map(a=>a.label.toLowerCase()+' '+a.year).join(', ')+'.</p></div>';
  }

  let stockCurPanel = '';
  if (V0) {
    const acc2 = {c20:{end:0,over:0}, c40:{end:0,over:0}};
    const rowsC = LOCATIONS.map(l=>{
      const i = state.inputs[l.id];
      const c = {end:"", over:""};
      SZ.forEach(sz=>{
        const res = sz==="c20" ? (effRes(i,"c20")) : (effRes(i,"c40"));
        const norm = sz==="c20" ? (i.norm20||0) : (i.norm40||0);
        let evac = 0;
        DIRECTIONS.forEach(d=>{
          const pl = finalPlanSizeForCtx(state.inputs,state.plan,l.id,d.key,sz);
          const r = locRate(l.id,d.key,sz);
          evac += Math.max(state.fact[l.id][d.key][sz]||0, pl*Math.min(r===null?0:r,1));
        });
        const end = Math.max(0, res - evac), over = Math.max(0, end - norm);
        acc2[sz].end += end; acc2[sz].over += over;
        c.end += '<td class="num-cell" style="text-align:center" title="сток '+fmt(res)+' − ожидаемый вывоз ~'+fmt(evac)+'">'+fmt(end)+'</td>';
        c.over += '<td class="num-cell" style="text-align:center;font-weight:700;'+(over>0?'color:var(--danger)':'')+'">'+fmt(over)+'</td>';
      });
      return '<tr><td class="loc-name">'+l.name+'</td>'+c.end+c.over+'</tr>';
    }).join("");
    const fC = '<tr class="total-row"><td>Итого</td>'+SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+fmt(acc2[sz].end)+'</td>').join("")+
      SZ.map(sz=>'<td class="num-cell" style="text-align:center">'+fmt(acc2[sz].over)+'</td>').join("")+'</tr>';
    stockCurPanel = '<div class="panel"><p class="panel-title">Сток на конец месяца — '+curLabel.toLowerCase()+'</p>'+
      '<p class="panel-sub">Сток сейчас − ожидаемый вывоз до конца месяца (факт, где он уже больше расчётного). «Сверх нормы» — то, что по прогнозу не успеют вывезти и что перейдёт в '+nLabel.toLowerCase()+'. Подход следующего месяца — на вкладке «'+nLabel+' — следующий».</p>'+
      '<table><thead><tr><th rowspan="2">Локация</th>'+grp("Ожидаемый остаток")+grp("Сверх нормы — перейдёт в "+nLabel.toLowerCase())+'</tr><tr>'+sub+sub+'</tr></thead>'+
      '<tbody>'+rowsC+fC+'</tbody></table></div>';
  }

  const head = '<div class="alert-card alert-info" style="margin-bottom:16px"><div class="alert-icon">i</div><div class="alert-body">'+
    '<div class="alert-kicker">Прогноз · '+(V0?'текущий месяц':'следующий месяц')+'</div><div class="alert-title">'+tLabel+' '+tYear+'</div>'+
    '<div class="alert-meta">По '+hist.length+' закрытым месяцам: '+hist[0].label.toLowerCase()+' '+hist[0].year+' – '+hist[hist.length-1].label.toLowerCase()+' '+hist[hist.length-1].year+
    (V0 ? '. Месяц ещё идёт: риск и остаток считаются по реальному плану '+monthOf(curLabel)+' и уже внесённому факту. ' : '. Текущий месяц ('+curLabel.toLowerCase()+') в расчёт выполнения не входит — он ещё не закрыт. ')+(hist.length<6?'Истории пока мало — смотрите на диапазон, а не только на число.':'')+
    (function(){ const m=forecastMAE(); return m ? ' <b>Средняя ошибка прошлых прогнозов: ±'+Math.round(m.mae*100)+' п.п.</b> (по '+m.months+' мес., сравнение внизу листа)' : ''; })()+'</div>'+
    '</div><div></div></div>';

  return { tLabel, tYear, curLabel, nLabel, nYear, hist, head, execPanel, riskPanel, stockPanel, yoyPanel, riskSum, hasLy: !!ly };
}

function renderForecastTab(){
  const P0 = forecastParts(true), P1 = forecastParts(false);
  if (P0.empty) return P0.empty;
  const hist = P0.hist;
  const pctS = v=> v===null||v===undefined ? "—" : Math.round(v*100)+"%";
  const card = (P, title, sub)=>{
    const r = P.riskSum;
    if (!r) return '<div class="kpi"><div class="kpi-label">'+title+'</div><div class="muted" style="margin-top:4px;font-size:12px">'+sub+'</div><div class="muted" style="margin-top:10px;font-size:13px">нет плана для расчёта</div></div>';
    return '<div class="kpi fc-card"><div class="kpi-label">'+title+'</div><div class="muted" style="margin:2px 0 10px;font-size:12px">'+sub+'</div>'+
      '<div class="fc-grid">'+
        '<div><div class="fc-k">Ожидаемое выполнение</div><div class="kpi-value" style="'+(r.overall!==null&&r.overall<0.8?'color:var(--danger)':'')+'">'+pctS(r.overall)+'</div><div class="dept-kpi-sub">20\' '+pctS(r.r20)+' · 40\' '+pctS(r.r40)+'</div></div>'+
        '<div><div class="fc-k">Недовывоз</div><div class="kpi-value">'+fmt(r.short)+' <span style="font-size:14px;font-weight:600;color:var(--muted)">шт</span></div><div class="dept-kpi-sub">20\' '+fmt(r.s20)+' · 40\' '+fmt(r.s40)+' · план '+fmt(r.plan)+'</div></div>'+
      '</div>'+
      '<div class="fc-k" style="margin-top:12px">Топ-3 по риску недовывоза</div>'+
      (r.top3.length ? '<div class="risk-row risk-head"><span></span><span></span><span>20\'</span><span>40\'</span><span>вып.</span></div>'+r.top3.map((x,i)=>
        '<div class="risk-row"><span class="risk-n">'+(i+1)+'</span><span class="risk-name">'+x.name+'</span>'+
        '<span class="risk-short">'+fmt(x.s20)+'</span><span class="risk-short">'+fmt(x.s40)+'</span>'+
        '<span class="risk-pct" style="'+heatStyle(x.r)+'">'+pctS(x.r)+'</span></div>').join("") : '<div class="dept-kpi-sub">недовывоз не ожидается</div>')+
    '</div>';
  };
  const m = forecastMAE();
  const head = '<div class="alert-card alert-info" style="margin-bottom:16px"><div class="alert-icon">i</div><div class="alert-body">'+
    '<div class="alert-kicker">Прогноз · текущий и следующий месяц</div><div class="alert-title">'+P0.tLabel+' '+P0.tYear+' и '+P1.tLabel.toLowerCase()+' '+P1.tYear+'</div>'+
    '<div class="alert-meta">Выполнение — по '+hist.length+' закрытым месяцам ('+hist[0].label.toLowerCase()+' '+hist[0].year+' – '+hist[hist.length-1].label.toLowerCase()+' '+hist[hist.length-1].year+'). '+
    P0.tLabel+' считается по своему ресурсу и плану с «Ввода данных» и уже внесённому факту; '+P1.tLabel.toLowerCase()+' — по остатку '+monthOf(P0.tLabel)+' плюс подход, который вы впишете ниже. '+
    (hist.length<6?'Истории пока мало — смотрите на диапазон, а не только на число. ':'')+
    (m ? '<b>Средняя ошибка прошлых прогнозов: ±'+Math.round(m.mae*100)+' п.п.</b>' : '')+'</div></div><div></div></div>';
  const cards = '<div class="fc-cards">'+
    card(P0, P0.tLabel+' '+P0.tYear+' — текущий', 'реальный план и внесённый факт')+
    card(P1, P1.tLabel+' '+P1.tYear+' — следующий', 'план = излишек на начало месяца')+'</div>';
  const yoy = (P0.hasLy ? P0.yoyPanel : '') + (P1.hasLy ? P1.yoyPanel : '') + (!P0.hasLy && !P1.hasLy ? P1.yoyPanel : '');
  return head + cards + P0.execPanel + P0.riskPanel + P1.riskPanel + P1.stockPanel + yoy + renderForecastAccuracy();
}

function renderArchiveTab(){
  if (state.archive.length===0) {
    return '<div class="panel"><p class="panel-title">Архив выполнения</p><p class="panel-sub">История по закрытым месяцам</p>'+
      '<div class="archive-empty">Пока нет закрытых месяцев.<br>Закройте текущий месяц на вкладке «Дашборд».</div></div>';
  }
  // ---- годовой обзор: закрытые месяцы + текущий открытый ----
  const months = state.archive.filter(a=>a.inputs&&a.plan&&a.fact)
    .map(a=>({ label:a.label, year:a.year, inputs:a.inputs, plan:a.plan, fact:a.fact, current:false,
               rPlan: (a.routes && a.routesPlan>0) ? a.routesPlan : null, rFact: (a.routes && a.routesPlan>0) ? a.routesFact : null }));
  const curRt = routesTotals(state.routes);
  months.push({ label:MONTH_NAMES[state.monthCursor%12], year:state.currentYear, inputs:state.inputs, plan:state.plan, fact:state.fact, current:true,
                rPlan: curRt.plan>0 ? curRt.plan : null, rFact: curRt.plan>0 ? curRt.fact : null });
  months.forEach(m=>{ m.t = totalsFullCtx(m.inputs,m.plan,m.fact); m.sm = sizeMetricsCtx(m.inputs,m.plan,m.fact); });
  const multiYear = new Set(months.map(m=>m.year)).size > 1;
  const lbls = months.map(m=>m.label.slice(0,3)+(multiYear?"'"+String(m.year).slice(2):"")+(m.current?"*":""));
  const ratio = (a,b)=> b>0 ? a/b : null;
  // текущий месяц без внесённого факта не рисуем на процентных графиках — это не провал, а пустой месяц
  const noFact = m=> m.current && m.t.totalFact===0;

  const chPlanFact = svgBars(lbls, [
    { name:"План", color:"#B9C7D4", values:months.map(m=>m.t.totalPlan) },
    { name:"Факт", color:"#004D77", values:months.map(m=>m.t.totalFact) },
  ]);
  const chStock = svgCombo(lbls,
    { name:"Сток", color:"#8BBFD8", values:months.map(m=>m.sm.c20.res+m.sm.c40.res) },
    { name:"% выполнения", color:"#C07A1C", values:months.map(m=>noFact(m)?null:ratio(m.t.totalFact,m.t.totalPlan)) });
  const chToStock = svgLines(lbls, [
    { name:"20'", color:"#0F7B68", values:months.map(m=>ratio(m.sm.c20.set,m.sm.c20.res)) },
    { name:"40'", color:"#004D77", values:months.map(m=>ratio(m.sm.c40.set,m.sm.c40.res)) },
  ], true);
  const chToSurplus = svgLines(lbls, [
    { name:"20'", color:"#0F7B68", values:months.map(m=>noFact(m)?null:ratio(m.sm.c20.fact,m.sm.c20.surplus)) },
    { name:"40'", color:"#004D77", values:months.map(m=>noFact(m)?null:ratio(m.sm.c40.fact,m.sm.c40.surplus)) },
  ], true);
  const chDept = svgLines(lbls, DIRECTIONS.map(d=>({
    name:d.label, color:d.color, values:months.map(m=>noFact(m)?null:ratio(m.t.factByDir[d.key], m.t.planByDir[d.key]))
  })), false);

  const chTrains = svgCombo(lbls, [
      { name:"План, поездов", color:"#B9C7D4", values:months.map(m=>m.rPlan) },
      { name:"Факт, поездов", color:"#0A6C9E", values:months.map(m=>m.rPlan===null?null:m.rFact) },
    ],
    { name:"% выполнения", color:"#C07A1C", values:months.map(m=>m.rPlan ? m.rFact/m.rPlan : null) });
  const box = (title, sub, svg, legend)=> '<div class="panel" style="margin-bottom:0"><p class="panel-title">'+title+'</p>'+(Array.isArray(sub) ? expl(sub[0], sub[1]) : '<p class="panel-sub">'+sub+'</p>')+svg+legend+'</div>';
  const overviewHtml =
    '<div class="chart-grid">'+
      box("План и факт по месяцам",["сколько контейнеров запланировали и сколько вывезли за каждый месяц, все департаменты вместе.","серый столбец — план, синий — факт, над столбцами — штуки. Синий ниже серого — недовывоз."], chPlanFact, chartLegend([{name:"План",color:"#B9C7D4"},{name:"Факт",color:"#004D77"}]))+
      box("Сток и выполнение",["столбцы — сколько контейнеров было на площадках (сток + подход, шкала слева). Линия — процент выполнения плана (шкала справа).","в месяц с высоким столбцом линия проседает — не справились с нагрузкой. Линия падает при обычном столбце — проблема в исполнении, а не в объёме."], chStock, chartLegend([{name:"Сток, шт",color:"#8BBFD8"},{name:"% выполнения",color:"#C07A1C"}]))+
      box("План к стоку",["какую долю всех контейнеров на площадках департаменты сами поставили в план, отдельно 20' и 40'.","это нагрузка, которую взяли: 60% — в план поставили больше половины стока. 100% не бывает — часть стока по норме остаётся на месте."], chToStock, chartLegend([{name:"20-футовые",color:"#0F7B68"},{name:"40-футовые",color:"#004D77"}]))+
      box("Вывезено от излишка",["какую часть излишка (контейнеров сверх нормы: сток + подход − норма) реально вывезли за месяц, отдельно 20' и 40'.","пунктир — 100%. На нём и выше — всё лишнее вывезли; ниже — часть контейнеров сверх нормы осталась на площадках."], chToSurplus, chartLegend([{name:"20-футовые",color:"#0F7B68"},{name:"40-футовые",color:"#004D77"}]))+
      box("Выполнение по департаментам",["процент выполнения плана каждым департаментом по месяцам.","пунктир — 100%; линия ниже — план не выполнен. Видно, кто проседает постоянно, а кто разово."], chDept, chartLegend(DIRECTIONS.map(d=>({name:d.label,color:d.color}))))+
      box("Выполнение плана поездов (НЗ)",["сколько поездов по направлениям НЗ запланировали (серый) и отправили (синий), линия — процент выполнения (шкала справа).","н/д — данные по поездам за месяц не вносились; их можно добавить через «Редактировать» в месяце ниже."], chTrains, chartLegend([{name:"План",color:"#B9C7D4"},{name:"Факт",color:"#0A6C9E"},{name:"% выполнения",color:"#C07A1C"}]))+
    '</div>'+
    '<p class="muted" style="font-size:11.5px;margin:8px 0 18px">* текущий месяц, ещё не закрыт — факт неполный</p>';

  let rows = state.archive.map((a,idx)=>{
    const r = pct(a.totalFact, a.totalPlan);
    const rHtml = r===null? "—" : '<span class="'+(r>=1?"diff-ok":"diff-bad")+'">'+Math.round(r*100)+'%</span>';
    const open = expandedArchiveIndex===idx;
    const editing = editingArchiveIndex===idx;
    const hasSnapshot = !!(a.inputs && a.plan && a.fact);

    let detail = "";
    if (open) {
      if (hasSnapshot) {
        const editBtn = '<button class="btn" style="margin-bottom:14px" onclick="event.stopPropagation(); toggleArchiveEdit('+idx+')">'+(editing?"Готово":"&#9998; Редактировать этот месяц")+'</button>';
        if (editing) {
          detail = '<div class="arch-detail">'+editBtn+renderArchiveEditForm(idx,a)+'</div>';
        } else {
          detail = '<div class="arch-detail">'+editBtn+renderDashboardTab({ inputs:a.inputs, plan:a.plan, fact:a.fact, monthLabel:a.label, closable:false, routesTotal: (a.routesPlan!==undefined ? {plan:a.routesPlan, fact:a.routesFact} : null), routesSnapshot: a.routes || null })+'</div>';
        }
      } else {
        detail = '<div class="arch-detail"><p class="muted" style="font-size:12.5px">Для этого месяца нет полного снимка данных (сохранён только итог) — редактирование и детальный дашборд недоступны.</p></div>';
      }
    }

    return '<div class="arch-row">'+
      '<div class="arch-summary" onclick="toggleArchiveRow('+idx+')">'+
      '<div class="arch-summary-left"><span class="arch-chevron'+(open?" open":"")+'">&#9656;</span><span class="loc-name">'+a.label+' '+(a.year||'')+'</span></div>'+
      '<div class="arch-summary-nums"><span>план '+fmt(a.totalPlan)+'</span><span>факт '+fmt(a.totalFact)+'</span><span>'+rHtml+'</span></div>'+
      '</div>'+detail+'</div>';
  }).join("");

  return '<p class="panel-title" style="font-size:16px;margin:0 0 6px">Итоги года</p>'+expl('сводка за все месяцы: план и факт, сток, эвакуация излишка, департаменты и поезда.','каждая точка или столбец — один месяц. Звёздочка * — текущий месяц: он ещё не закрыт, факт по нему неполный. Наведите на точку или столбец — точное значение.')+ overviewHtml +
    '<div class="panel"><p class="panel-title">Архив по месяцам</p>'+expl('все закрытые месяцы; в строке — итоговый план, факт и процент выполнения за месяц.','нажмите на месяц — откроется его полный дашборд. Кнопка «Редактировать» внутри позволяет исправить цифры месяца, текущий месяц при этом не меняется.')+''+
    rows+'</div>';
}

// ---------- top-level render ----------
// ================= ДРОП-ОФФ =================
// Инструмент дропов работает в своём окне: его стили и логика не смешиваются с основными.
const DROPS_LS_KEY = "transit_dropoff_v1";
let DROPS_HTML = null;
function dropsHtml(){
  if (DROPS_HTML===null){
    const b64 = document.getElementById("drops-src").textContent.trim();
    const bytes = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    DROPS_HTML = new TextDecoder("utf-8").decode(bytes);
  }
  return DROPS_HTML;
}
function mountDrops(){
  const fr = document.getElementById("dropsFrame");
  if (!fr) return;
  fr.addEventListener("load", ()=>{
    try{
      const doc = fr.contentDocument;
      const fit = ()=>{ fr.style.height = Math.max(480, Math.ceil(doc.body.getBoundingClientRect().height) + 4) + "px"; };
      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(doc.body);
      setTimeout(fit, 300);
    }catch(e){}
  });
  fr.srcdoc = dropsHtml();
}
function mainToast(msg){
  let t = document.getElementById("mainToast");
  if (!t){ t = document.createElement("div"); t.id = "mainToast"; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.display = "none"; }, 3800);
}
function render(){
  try { refreshAutoAcc(); } catch(e){}
  document.getElementById("monthPill").textContent = "Текущий месяц: " + MONTH_NAMES[state.monthCursor % 12] + " " + (state.currentYear||"");
  const tabsDef = [
    { key: "input", label: "Ввод данных" },
    { key: "distribute", label: "Распределение" },
    { key: "trains", label: "Поезда" },
    { key: "dashboard", label: "Дашборд" },
    { key: "forecast", label: "Прогноз" },
    { key: "archive", label: "Архив" },
    { key: "drops", label: "Дроп-офф" },
  ];
  if (typeof ONLINE!=="undefined" && ONLINE.isAdmin) tabsDef.push({ key: "admin", label: "Админ" });
  document.getElementById("tabs").innerHTML = tabsDef.map(t=>
    '<div class="tab '+(state.tab===t.key?"active":"")+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</div>'
  ).join("");
  const tabsEl = document.getElementById("tabs"), act = tabsEl.querySelector(".tab.active");
  if (act && tabsEl.scrollWidth > tabsEl.clientWidth) tabsEl.scrollLeft = act.offsetLeft - (tabsEl.clientWidth - act.offsetWidth)/2;

  let html = "";
  if (state.tab==="input") html = renderInputTab();
  else if (state.tab==="distribute") html = renderDistributeTab();
  else if (state.tab==="trains") html = renderTrainsTab();
  else if (state.tab==="dashboard") html = renderDashboardTab();
  else if (state.tab==="forecast") html = renderForecastTab();
  else if (state.tab==="archive") html = renderArchiveTab();
  else if (state.tab==="admin") html = (typeof renderAdminTab==="function") ? renderAdminTab() : "";
  else if (state.tab==="drops") html = '<iframe id="dropsFrame" title="Ставки дроп-офф" style="width:100%;border:0;display:block;height:640px;background:transparent"></iframe>';
  document.getElementById("content").innerHTML = html;
  if (typeof ONLINE!=="undefined") { ONLINE.renderPending=false; applyPerms(); setUserChip(); }
  if (state.tab==="drops") mountDrops();
}

const IMP_FIELDS = ["imp20","imp40","impF20","impF40"];
const META_EXCL = new Set(["tab","forecastView","inputs","routes","plan","fact","distributionShares","capacitySelection","capacityTeu","planningHorizon","forecastLog","forecastInflow","archive"]);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function canon(v){
  if (Array.isArray(v)) return "["+v.map(canon).join(",")+"]";
  if (v && typeof v==="object") return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}
function pickKeys(o, keys){ const r={}; keys.forEach(k=>{ if(o && o[k]!==undefined) r[k]=o[k]; }); return r; }
function omitKeys(o, keys){ const r={}; Object.keys(o||{}).forEach(k=>{ if(!keys.includes(k)) r[k]=o[k]; }); return r; }

// ---------- состояние <-> документы ----------
function docsFromState(){
  const d = {}, inp = {}, imp = {};
  LOCATIONS.forEach(l=>{
    const r = state.inputs[l.id] || {};
    inp[l.id] = omitKeys(r, IMP_FIELDS); imp[l.id] = pickKeys(r, IMP_FIELDS);
  });
  d.inputs = inp; d.import = imp; d.routes = state.routes;
  DIRECTIONS.forEach(dir=>{
    const p = {}, f = {};
    LOCATIONS.forEach(l=>{ p[l.id] = state.plan[l.id][dir.key]; f[l.id] = state.fact[l.id][dir.key]; });
    d["plan_"+dir.key] = p; d["fact_"+dir.key] = f;
  });
  d.shares = state.distributionShares;
  d.trainsCfg = { capacitySelection: state.capacitySelection, capacityTeu: state.capacityTeu, planningHorizon: state.planningHorizon };
  d.forecast = { log: state.forecastLog || [], inflow: state.forecastInflow };
  const meta = {}; Object.keys(state).forEach(k=>{ if(!META_EXCL.has(k)) meta[k]=state[k]; });
  d.meta = meta;
  (state.archive||[]).forEach((a,i)=>{ d["a"+String(i).padStart(3,"0")] = a; });
  return clone(d);
}
function applyDocs(map){
  if (map.inputs || map.import) {
    LOCATIONS.forEach(l=>{
      const cur = state.inputs[l.id] || {};
      const a = (map.inputs && map.inputs[l.id]) || omitKeys(cur, IMP_FIELDS);
      const b = (map.import && map.import[l.id]) || pickKeys(cur, IMP_FIELDS);
      state.inputs[l.id] = Object.assign({}, a, b);
    });
  }
  if (map.routes) state.routes = Object.assign(defaultRoutesState(), clone(map.routes));
  DIRECTIONS.forEach(dir=>{
    const p = map["plan_"+dir.key], f = map["fact_"+dir.key];
    LOCATIONS.forEach(l=>{
      if (p && p[l.id]) state.plan[l.id][dir.key] = clone(p[l.id]);
      if (f && f[l.id]) state.fact[l.id][dir.key] = clone(f[l.id]);
    });
  });
  if (map.shares) state.distributionShares = clone(map.shares);
  if (map.trainsCfg) { ["capacitySelection","capacityTeu","planningHorizon"].forEach(k=>{ if(map.trainsCfg[k]) state[k]=clone(map.trainsCfg[k]); }); }
  if (map.forecast) { if (map.forecast.log) state.forecastLog = clone(map.forecast.log); if (map.forecast.inflow) state.forecastInflow = clone(map.forecast.inflow); }
  if (map.meta) Object.keys(map.meta).forEach(k=>{ state[k] = clone(map.meta[k]); });
  if (map.meta) {
    state.archive = Object.keys(map).filter(id=>/^a\d{3}$/.test(id)).sort().map(id=>clone(map[id]));
  }
  migrateState();
  try { refreshAutoAcc(); } catch(e){}
}
function areaOfDoc(id){ if (/^a\d{3}$/.test(id)) return "archive"; return id; }
function permsFor(dept){
  const m = ONLINE.perms && ONLINE.perms.map;
  return (m && m[dept]) || DEFAULT_PERMS[dept] || [];
}
function canWriteArea(a){
  if (!ONLINE.me) return false;
  if (ONLINE.isAdmin) return true;
  if (a==="archive" || a==="meta") return false;
  return permsFor(ONLINE.me.dept).includes(a);
}
function areaLabel(id){
  if (/^a\d{3}$/.test(id)) return "Архив";
  if (id==="meta") return "Месяц";
  const a = AREAS.find(x=>x.id===id); return a ? a.label : id;
}

// ---------- запись ----------
function markPending(id){ ONLINE.pending.add(id); ONLINE.ver[id] = (ONLINE.ver[id]||0)+1; }
let flushTimer = null, flushing = false;
function scheduleFlush(){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 450); }
function syncPersist(){
  if (!ONLINE.ready) return;
  try { refreshAutoAcc(); } catch(e){}
  const cur = docsFromState(), denied = [];
  Object.keys(cur).forEach(id=>{
    if (ONLINE.synced[id] === canon(cur[id])) return;
    if (canWriteArea(areaOfDoc(id))) markPending(id); else denied.push(id);
  });
  Object.keys(ONLINE.synced).forEach(id=>{
    if (id in cur) return;
    if (canWriteArea(areaOfDoc(id))) { markPending(id); ONLINE.deleteIds.add(id); } else denied.push(id);
  });
  if (denied.length) {
    const map = Object.assign({}, ONLINE.remote);
    ONLINE.pending.forEach(id=>{ if (cur[id]) map[id] = cur[id]; });
    applyDocs(map);
    mainToast("Нет прав на изменение: "+[...new Set(denied.map(areaLabel))].join(", "));
  }
  if (ONLINE.pending.size) scheduleFlush();
}
async function flush(){
  if (flushing) { scheduleFlush(); return; }
  flushing = true;
  const done = [];
  try {
    for (const id of [...ONLINE.pending]) {
      const v = ONLINE.ver[id];
      try {
        const cur = docsFromState();
        if (!(id in cur) && ONLINE.deleteIds.has(id)) {
          await ONLINE.db.doc("app/"+id).delete();
          delete ONLINE.synced[id]; delete ONLINE.remote[id]; ONLINE.deleteIds.delete(id);
        } else if (id in cur) {
          await ONLINE.db.doc("app/"+id).set(cur[id]);
          ONLINE.synced[id] = canon(cur[id]); ONLINE.remote[id] = cur[id];
        }
        done.push(id);
      } catch(e) {
        mainToast("Не удалось сохранить («"+areaLabel(id)+"»): "+((e&&e.message)||e));
      }
      if (ONLINE.ver[id] === v) ONLINE.pending.delete(id);
    }
  } finally { flushing = false; }
  if (ONLINE.pending.size) scheduleFlush();
  if (done.length && ONLINE.me) writeLog(done);
  setSyncChip();
}
async function writeLog(ids){
  if (ONLINE.server) return;
  try {
    const labels = [...new Set(ids.map(areaLabel))];
    ONLINE.myLog.unshift({ t: Date.now(), n: ONLINE.me.name, d: ONLINE.me.dept, a: labels });
    ONLINE.myLog = ONLINE.myLog.slice(0, 60);
    await ONLINE.db.doc("log/"+ONLINE.me.id).set({ entries: ONLINE.myLog });
  } catch(e){}
}
function pushAll(){
  const cur = docsFromState();
  Object.keys(cur).forEach(markPending);
  Object.keys(ONLINE.synced).forEach(id=>{ if(!(id in cur)){ markPending(id); ONLINE.deleteIds.add(id); } });
  scheduleFlush();
}

// ---------- чтение ----------
function scheduleRender(){
  const a = document.activeElement;
  if (a && a.tagName==="INPUT" && a.closest && a.closest("#content")) { ONLINE.renderPending = true; return; }
  render();
}
document.addEventListener("focusout", function(){
  if (!ONLINE.renderPending) return;
  setTimeout(function(){
    const a = document.activeElement;
    if (ONLINE.renderPending && !(a && a.tagName==="INPUT")) { ONLINE.renderPending = false; render(); }
  }, 80);
});
function onAppSnap(snap){
  const remote = {};
  snap.docs.forEach(d=>{ remote[d.id] = clone(d.data()||{}); });
  ONLINE.remote = remote; ONLINE.gotApp = true;
  const cur = docsFromState();
  const map = Object.assign({}, remote);
  ONLINE.pending.forEach(id=>{ if (cur[id]) map[id] = cur[id]; });
  let changed = false;
  Object.keys(remote).forEach(id=>{ if (!ONLINE.pending.has(id) && ONLINE.synced[id] !== canon(remote[id])) changed = true; });
  Object.keys(ONLINE.synced).forEach(id=>{ if (/^a\d{3}$/.test(id) && !(id in remote) && !ONLINE.pending.has(id)) changed = true; });
  if (changed) applyDocs(map);
  const cur2 = docsFromState();
  Object.keys(cur2).forEach(id=>{ if (!ONLINE.pending.has(id)) ONLINE.synced[id] = canon(cur2[id]); });
  Object.keys(ONLINE.synced).forEach(id=>{ if (!(id in cur2) && !ONLINE.pending.has(id)) delete ONLINE.synced[id]; });
  if (ONLINE.booted) { if (changed) scheduleRender(); } else bootCheck();
  setSyncChip();
}
function onAuthSnap(snap){
  const u = {};
  snap.docs.forEach(d=>{ u[d.id] = clone(d.data()||{}); });
  ONLINE.users = u; ONLINE.gotAuth = true;
  if (ONLINE.me) {
    const mine = u[ONLINE.me.id];
    if (!mine || mine.hash !== ONLINE.me.hash || mine.dept !== ONLINE.me.dept) { logoutUser("Ваши данные для входа изменены. Войдите заново."); return; }
  }
  if (!ONLINE.booted) bootCheck();
  else if (ONLINE.isAdmin && state.tab==="admin") scheduleRender();
}
function onPermsSnap(doc){
  ONLINE.perms = doc.exists ? clone(doc.data()) : null;
  if (ONLINE.me && ONLINE.booted) scheduleRender();
}
function onLogSnap(snap){
  const all = [];
  snap.docs.forEach(d=>{ ((d.data()||{}).entries||[]).forEach(e=>all.push(e)); });
  all.sort((a,b)=>b.t-a.t); ONLINE.logs = all.slice(0,80);
  if (ONLINE.isAdmin && state.tab==="admin") scheduleRender();
}

// ---------- пароли ----------
function hex(buf){ return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
function randHex(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return hex(a); }
async function hashPw(pw, saltHex, iter){
  const salt = new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations: iter, hash:"SHA-256" }, key, 256));
}
function loginId(login){ return "u_" + hex(new TextEncoder().encode(String(login).trim().toLowerCase())); }
async function makeUser(login, name, dept, pw){
  const salt = randHex(16), iter = 150000;
  return { login: String(login).trim(), name: String(name||login).trim(), dept, salt, iter, hash: await hashPw(pw, salt, iter) };
}

function logoHtml(){ const l = document.querySelector(".topbar .logo"); return l ? l.outerHTML : ""; }

    body = '<p class="auth-sub">Подключение к общей базе…</p>';

  } else if (mode==="setup") {
    body = '<p class="auth-title">Первый запуск</p><p class="auth-sub">Создайте учётную запись администратора. Она будет вашей, с правом менять всё и заводить остальных.</p>'+note+
      '<label class="auth-l" for="su_name">Имя</label><input class="fld" id="su_name" autocomplete="off">'+

      '<label class="auth-l" for="su_pw">Пароль (не короче 6 знаков)</label><input class="fld" id="su_pw" type="password" autocomplete="new-password">'+
      '<label class="auth-l" for="su_pw2">Повторите пароль</label><input class="fld" id="su_pw2" type="password" autocomplete="new-password">'+
      '<button class="btn btn-primary auth-btn" onclick="doSetup()">Создать и войти</button>';
  } else if (mode==="setup-wait") {
    body = '<p class="auth-title">Инструмент ещё не настроен</p><p class="auth-sub">Администратор не создан. Первую настройку делает владелец страницы, обратитесь к нему.</p>';
  } else {
    body = '<p class="auth-title">Вход</p>'+note+
      '<label class="auth-l" for="lg_dept">Департамент</label><select class="fld" id="lg_dept">'+
        '<option value="admin">Администратор</option>'+DEPTS.map(d=>'<option value="'+d.key+'">'+d.label+'</option>').join("")+'<option value="viewer">'+VIEWER.label+'</option></select>'+
      '<label class="auth-l" for="lg_login">Логин</label><input class="fld" id="lg_login" autocomplete="username">'+
      '<label class="auth-l" for="lg_pw">Пароль</label><input class="fld" id="lg_pw" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">'+
      '<label class="auth-chk"><input type="checkbox" id="lg_rem" checked> Запомнить на этом устройстве</label>'+
      '<button class="btn btn-primary auth-btn" onclick="doLogin()">Войти</button>'+
      (ONLINE.canWrite===false ? '<div class="auth-msg">У вас доступ только для просмотра. Попросите владельца страницы выдать вам права участника (Contributor), иначе изменения не сохранятся.</div>' : '');
  }
  root.innerHTML = '<div class="auth-card"><div class="auth-logo">'+logoHtml()+'</div>'+body+'</div>';
