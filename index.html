<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>
(function(){
  var KEY="evac_view";
  function get(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
  var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
  var phone = touch && Math.min(screen.width, screen.height) < 700;
  var mode = get() || "desk";
  function setMeta(c){
    var old = document.querySelectorAll('meta[name="viewport"]');
    for (var i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
    var m = document.createElement("meta"); m.name = "viewport"; m.content = c;
    document.head.appendChild(m);
  }
  var DESK="width=1280,minimum-scale=0.1,maximum-scale=6,user-scalable=yes,viewport-fit=cover";
  var NORM="width=device-width,initial-scale=1,viewport-fit=cover";
  window.evacVp = function(inApp){ if (phone) setMeta(inApp && mode !== "phone" ? DESK : NORM); };
  window.evacVp(false);
  window.toggleView = function(){
    try { localStorage.setItem(KEY, mode === "phone" ? "desk" : "phone"); } catch(e){}
    location.reload();
  };
  document.addEventListener("DOMContentLoaded", function(){
    var b = document.getElementById("viewBtn");
    if (b && phone) { b.style.display = ""; b.textContent = mode === "phone" ? "Вид: ПК" : "Вид: телефон"; }
  });
})();
</script>

    .fc-cards { grid-template-columns:1fr; }

    .ao-grid { grid-template-columns:1fr; }

#authRoot{display:none;position:fixed;inset:0;z-index:2000;background:#004D77;align-items:center;justify-content:center;padding:16px;overflow:auto}
.auth-card{width:100%;max-width:400px;background:#004D77;border:0;border-radius:0;padding:26px 24px;box-shadow:none;color:#fff}
.auth-logo{background:#004D77;margin-bottom:22px}.auth-logo .logo{display:block;height:54px;width:auto;max-width:100%}
.auth-title{font-size:20px;font-weight:700;margin:0 0 6px;color:#fff}
.auth-sub{font-size:13px;color:#C9DCE8;margin:0 0 14px;line-height:1.5}
.auth-l{display:block;font-size:11.5px;font-weight:600;color:#C9DCE8;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.auth-chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:14px 0 4px;color:#fff}
.auth-btn{justify-content:center;width:100%;margin-top:16px;padding:11px 14px;font-size:14px;background:#fff!important;color:#004D77!important;border-color:#fff!important}
.auth-msg{font-size:12.5px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 10px;margin:10px 0}
.fld{display:block;width:100%;padding:9px 10px;border:1.5px solid var(--border-strong);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.fld:focus{outline:2px solid var(--brand);outline-offset:1px}.fld-sm{display:inline-block;width:180px;padding:6px 8px}
.user-chip{font-size:12.5px;font-weight:600;color:#fff;opacity:.95;white-space:nowrap}.sync-chip{font-size:11px;color:#fff;opacity:.7}
.adm-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:14px}
.adm-form .auth-l{margin-top:0}.adm-actions{display:flex;gap:10px;flex-wrap:wrap}
.adm-msg{font-size:12.5px;color:var(--ok);min-height:16px;margin:4px 0}
.adm-warn{background:#FFF6E5;border:1px solid #E8CD93;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.numfield input:disabled{background:#EEF2F6;color:#7B8C9B;cursor:not-allowed}
.btn.ro,.btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:760px){.user-chip{display:none}}

// ---------- zero templates (для нового пустого месяца) ----------
// Сдача импорта и ремонт: из ресурса убирается плановый подход импорта и
// добавляется то, что реально станет доступно к выдаче в месяце.
// Доступно = подход × %сдачи × ((1−%ремонта) + %ремонта × доля успевших отремонтироваться),
// доля успевших = max(0,(30−срок)/30) — сдача равномерная по месяцу.
const REPAIR_MONTH_DAYS = 30;
function repairFrac(i){ const d=Math.min(REPAIR_MONTH_DAYS,Math.max(0,i.days||0)); return Math.max(0,(REPAIR_MONTH_DAYS-d)/REPAIR_MONTH_DAYS); }
function importParts(i, sz){
  const P = (sz==="c20" ? i.imp20 : i.imp40)||0;
  if (!P) return {plan:0,arrive:0,fix:0,okRep:0,tail:0,avail:0,notArrive:0};
  const acc = Math.min(100,Math.max(0,i.acc===undefined?100:i.acc))/100;
  const rep = Math.min(100,Math.max(0,i.rep||0))/100;
  const arrive = P*acc, fix = arrive*rep, okRep = fix*repairFrac(i), tail = fix-okRep;
  return {plan:P, arrive, fix, okRep, tail, avail: arrive-fix+okRep, notArrive: P-arrive};
}
function effRes(i, sz){
  const raw = (sz==="c20" ? i.resource20 : i.resource40)||0;
  if (i.noAdj) return raw;
  const pt = importParts(i, sz);
  if (!pt.plan) return raw;
  return Math.max(0, Math.round(raw + pt.avail));
}

// pure re-implementation of the plan math for a given (inputs, plan, fact)
// triple — used both for live state and for bootstrapping archive totals
function computeMonthTotals(inputs, plan, fact){
  let totalVolume=0;
  const planByDir={}, factByDir={};
  DIRECTIONS.forEach(d=>{ planByDir[d.key]=0; factByDir[d.key]=0; });
  LOCATIONS.forEach(l=>{
    const i = inputs[l.id];
    const vol = Math.max(0,(effRes(i,"c20"))-(i.norm20||0)) + Math.max(0,(effRes(i,"c40"))-(i.norm40||0));
    totalVolume += vol;
    let sumManual = 0;
    DIRECTIONS.forEach(d=>{ sumManual += (plan[l.id][d.key].c20||0)+(plan[l.id][d.key].c40||0); });
    const leftover = Math.max(0, vol - sumManual);
    DIRECTIONS.forEach(d=>{
      planByDir[d.key] += finalPlanForCtx(inputs, plan, l.id, d.key);
      factByDir[d.key] += (fact[l.id][d.key].c20||0)+(fact[l.id][d.key].c40||0);
    });
  });
  const totalPlan = Object.values(planByDir).reduce((a,b)=>a+b,0);
  const totalFact = Object.values(factByDir).reduce((a,b)=>a+b,0);
  return { totalVolume, totalPlan, totalFact, planByDir, factByDir };
}

function migrateState(){
  if (!state.currentYear) state.currentYear = 2026;
  (state.archive||[]).forEach(a=>{
    if (!a.year) a.year = 2026;
    if (a.monthIndex===undefined) a.monthIndex = MONTH_NAMES.indexOf(a.label);
  });
  (state.archive||[]).forEach(a=>{ if (a.plan && !a.plan.__final){ a.plan.__final = true; } });
  (state.archive||[]).forEach(a=>{ if (a.plan && a.inputs && a.fact){ const t=computeMonthTotals(a.inputs,a.plan,a.fact); a.totalVolume=t.totalVolume; a.totalPlan=t.totalPlan; a.totalFact=t.totalFact; a.planByDir=t.planByDir; a.factByDir=t.factByDir; } });

// ---------- derived (all in штуках, except the trains tab) ----------
// ctx-версии не завязаны на глобальный state — нужны, чтобы тем же кодом
// рисовать дашборд и для текущего месяца, и для любого месяца из архива.
// Остаток/автодобавка считаются ОТДЕЛЬНО по 20' и 40' (излишек одного
// типоразмера не закрывает дефицит другого), затем при необходимости
// суммируются для общих показателей (дашборд, факт, %).
function volume20ForCtx(inputs, locId){ const i=inputs[locId]; return Math.max(0,(effRes(i,"c20"))-(i.norm20||0)); }
function volume40ForCtx(inputs, locId){ const i=inputs[locId]; return Math.max(0,(effRes(i,"c40"))-(i.norm40||0)); }
function volumeForCtx(inputs, locId){ return volume20ForCtx(inputs,locId) + volume40ForCtx(inputs,locId); }
function volumeFor(locId){ return volumeForCtx(state.inputs, locId); }
function volume20For(locId){ return volume20ForCtx(state.inputs, locId); }
function volume40For(locId){ return volume40ForCtx(state.inputs, locId); }

function manualSizeForCtx(plan, locId, deptKey, sizeKey){ return plan[locId][deptKey][sizeKey]||0; }
function manualCountForCtx(plan, locId, deptKey){
  return manualSizeForCtx(plan,locId,deptKey,"c20") + manualSizeForCtx(plan,locId,deptKey,"c40");
}
function manualCountFor(locId, deptKey){ return manualCountForCtx(state.plan, locId, deptKey); }
function factCountForCtx(fact, locId, deptKey){
  const f = fact[locId][deptKey];
  return (f.c20||0) + (f.c40||0);
}
function factCountFor(locId, deptKey){ return factCountForCtx(state.fact, locId, deptKey); }

function sumManualSizeForCtx(plan, locId, sizeKey){
  return DIRECTIONS.reduce((s,d)=>s+manualSizeForCtx(plan,locId,d.key,sizeKey),0);
}
function sumManualForCtx(plan, locId){
  return sumManualSizeForCtx(plan,locId,"c20") + sumManualSizeForCtx(plan,locId,"c40");
}
function sumManualFor(locId){ return sumManualForCtx(state.plan, locId); }
function overshootFor(locId){
  return Math.max(0, sumManualFor(locId) - volumeFor(locId));
}
function overshoot20For(locId){
  return Math.max(0, sumManualSizeForCtx(state.plan,locId,"c20") - volume20For(locId));
}
function overshoot40For(locId){
  return Math.max(0, sumManualSizeForCtx(state.plan,locId,"c40") - volume40For(locId));
}

// "сырой" остаток для отображения — Ресурс - Норма - План одной формулой,
// без промежуточного обнуления, чтобы был виден реальный перерасход
// (отрицательное число), если план больше доступного ресурса.
function rawLeftoverSizeForCtx(inputs, plan, locId, sizeKey){
  const i = inputs[locId];
  const resource = sizeKey==="c20" ? (effRes(i,"c20")) : (effRes(i,"c40"));
  const norm = sizeKey==="c20" ? (i.norm20||0) : (i.norm40||0);
  return resource - norm - sumManualSizeForCtx(plan, locId, sizeKey);
}
function rawLeftover20For(inputs, plan, locId){ return rawLeftoverSizeForCtx(inputs, plan, locId, "c20"); }
function rawLeftover40For(inputs, plan, locId){ return rawLeftoverSizeForCtx(inputs, plan, locId, "c40"); }
// клампится 0 — используется для автораспределения (нельзя добавить отрицательно)
function leftoverSizeForCtx(inputs, plan, locId, sizeKey){
  const vol = sizeKey==="c20" ? volume20ForCtx(inputs,locId) : volume40ForCtx(inputs,locId);
  return Math.max(0, vol - sumManualSizeForCtx(plan,locId,sizeKey));
}
function leftover20For(inputs, plan, locId){ return leftoverSizeForCtx(inputs, plan, locId, "c20"); }
function leftover40For(inputs, plan, locId){ return leftoverSizeForCtx(inputs, plan, locId, "c40"); }
function leftoverForCtx(inputs, plan, locId){
  return leftoverSizeForCtx(inputs,plan,locId,"c20") + leftoverSizeForCtx(inputs,plan,locId,"c40");
}
function leftoverFor(locId){ return leftoverForCtx(state.inputs, state.plan, locId); }

function autoAddSizeForCtx(inputs, plan, locId, deptKey, sizeKey){
  if (plan && plan.__final) return 0; // архив: план ровно такой, как вписан
  const sharePct = (state.distributionShares[locId] && state.distributionShares[locId][deptKey]!==undefined)
    ? state.distributionShares[locId][deptKey] : 0;
  return leftoverSizeForCtx(inputs, plan, locId, sizeKey) * (sharePct/100);
}
function autoAddForCtx(inputs, plan, locId, deptKey){
  return autoAddSizeForCtx(inputs,plan,locId,deptKey,"c20") + autoAddSizeForCtx(inputs,plan,locId,deptKey,"c40");
}
function autoAddFor(locId, deptKey){ return autoAddForCtx(state.inputs, state.plan, locId, deptKey); }

function finalPlanSizeForCtx(inputs, plan, locId, deptKey, sizeKey){
  return manualSizeForCtx(plan,locId,deptKey,sizeKey) + autoAddSizeForCtx(inputs,plan,locId,deptKey,sizeKey);
}
function finalPlan20For(inputs, plan, locId, deptKey){ return finalPlanSizeForCtx(inputs,plan,locId,deptKey,"c20"); }
function finalPlan40For(inputs, plan, locId, deptKey){ return finalPlanSizeForCtx(inputs,plan,locId,deptKey,"c40"); }
function finalPlanForCtx(inputs, plan, locId, deptKey){
  return finalPlanSizeForCtx(inputs,plan,locId,deptKey,"c20") + finalPlanSizeForCtx(inputs,plan,locId,deptKey,"c40");
}
function finalPlanFor(locId, deptKey){ return finalPlanForCtx(state.inputs, state.plan, locId, deptKey); }

// точный TEU итогового плана (20'=1 TEU, 40'=2 TEU) — теперь считается
// без оценок, т.к. остаток уже распределяется отдельно по типоразмерам
function finalPlanTeuFor(locId, deptKey){
  return teu(
    finalPlanSizeForCtx(state.inputs, state.plan, locId, deptKey, "c20"),
    finalPlanSizeForCtx(state.inputs, state.plan, locId, deptKey, "c40")
  );
}
function routesForLoc(locId){ return ROUTES.filter(r=>r.loc===locId); }
function routesTotals(routesObj){
  let plan=0, fact=0;
  ROUTES.forEach(r=>{ const rs=(routesObj&&routesObj[r.key])||{}; plan+=rs.plan||0; fact+=rs.fact||0; });
  return { plan, fact };
}
function routesBreakdownHtml(routesObj){
  const rows = ROUTES.map(r=>({ r, rs: (routesObj&&routesObj[r.key]) || {plan:0,fact:0} })).filter(x=>x.rs.plan>0 || x.rs.fact>0);
  if (rows.length===0) return "";
  const maxVal = Math.max(1, ...rows.map(x=>Math.max(x.rs.plan||0, x.rs.fact||0)));
  return rows.map(x=>{
    const ratio = pct(x.rs.fact, x.rs.plan);
    const ratioTxt = ratio===null ? "—" : Math.round(ratio*100)+"%";
    const planW = ((x.rs.plan||0)/maxVal)*100;
    const factW = ((x.rs.fact||0)/maxVal)*100;
    return '<div style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px">'+
      '<span style="font-weight:500">'+x.r.label+'</span>'+
      '<span class="mono muted">'+fmt(x.rs.plan)+' / '+fmt(x.rs.fact)+' · '+ratioTxt+'</span></div>'+
      '<div style="height:6px;background:#E4EAF0;border-radius:3px;margin-bottom:3px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+planW+'%;background:#B9C7D4;border-radius:3px"></div></div>'+
      '<div style="height:6px;background:#E4EAF0;border-radius:3px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+factW+'%;background:#004D77;border-radius:3px"></div></div>'+
      '</div>';
  }).join("");
}
function trainsPlanCountFor(locId){
  return routesForLoc(locId).filter(r=>state.routes[r.key].limited).reduce((s,r)=>s+(state.routes[r.key].plan||0),0);
}
function trainsCapacityFor(locId){
  return routesForLoc(locId).filter(r=>state.routes[r.key].limited).reduce((s,r)=>{
    const rs = state.routes[r.key];
    return s + (rs.plan||0)*(rs.teuPerTrain||0);
  },0);
}
// целевая норма стока в штуках (20'/40'), рассчитанная от плана поездов:
// норма (TEU, горизонт) делится между лимитными направлениями локации
// пропорционально их доле в общей вместимости, а внутри направления —
// по его собственным долям 40'/20' (например 0,8 / 0,2), затем TEU
// переводится в штуки (20'=÷1, 40'=÷2, т.к. 1×40'=2 TEU).
function routeNormSplitFor(locId){
  const totalCap = trainsCapacityFor(locId);
  const horizon = state.planningHorizon[locId]!==undefined ? state.planningHorizon[locId] : 2;
  const horizonNorm = totalCap / WEEKS_PER_MONTH * horizon;
  let norm20 = 0, norm40 = 0;
  if (totalCap > 0) {
    routesForLoc(locId).filter(r=>state.routes[r.key].limited).forEach(r=>{
      const rs = state.routes[r.key];
      const routeCap = (rs.plan||0)*(rs.teuPerTrain||0);
      const routeShareOfCap = routeCap / totalCap;
      const routeNormTeu = horizonNorm * routeShareOfCap;
      norm40 += (routeNormTeu * shareNum(rs.share40)) / 2;
      norm20 += (routeNormTeu * shareNum(rs.share20)) / 1;
    });
  }
  return { norm20, norm40 };
}
function applyComputedNorm(locId){
  const s = routeNormSplitFor(locId);
  state.inputs[locId].norm20 = Math.round(s.norm20);
  state.inputs[locId].norm40 = Math.round(s.norm40);
  saveAndRender();
}
function totals(){
  return computeMonthTotals(state.inputs, state.plan, state.fact);
}
function totalsFullCtx(inputs, plan, fact){
  let totalVolume=0; const planByDir={}; const factByDir={};
  DIRECTIONS.forEach(d=>{ planByDir[d.key]=0; factByDir[d.key]=0; });
  LOCATIONS.forEach(l=>{
    totalVolume += volumeForCtx(inputs, l.id);
    DIRECTIONS.forEach(d=>{
      planByDir[d.key] += finalPlanForCtx(inputs, plan, l.id, d.key);
      factByDir[d.key] += factCountForCtx(fact, l.id, d.key);
    });
  });
  const totalPlan = Object.values(planByDir).reduce((a,b)=>a+b,0);
  const totalFact = Object.values(factByDir).reduce((a,b)=>a+b,0);
  return { totalVolume, planByDir, factByDir, totalPlan, totalFact };
}
function totalsFull(){ return totalsFullCtx(state.inputs, state.plan, state.fact); }

// итоговый план на момент закрытия: вписанный + автодобор по текущим долям.
// Дальше не пересчитывается; вписанный сохраняется в __set для «плана к стоку».
function bakeFinalPlan(inputs, plan){
  const out = { __final: true, __set: JSON.parse(JSON.stringify(plan)) };
  LOCATIONS.forEach(l=>{
    out[l.id] = {};
    DIRECTIONS.forEach(d=>{
      out[l.id][d.key] = {
        c20: Math.round(finalPlanSizeForCtx(inputs, plan, l.id, d.key, "c20")),
        c40: Math.round(finalPlanSizeForCtx(inputs, plan, l.id, d.key, "c40")),
      };
    });
  });
  return out;
}
function closeMonth(){

  const label = MONTH_NAMES[state.monthCursor % 12];

  const mIdx = state.monthCursor % 12;
  state.archive.push({
    label, year: state.currentYear, monthIndex: mIdx, totalVolume: t.totalVolume, totalPlan: t.totalPlan, totalFact: t.totalFact,
    planByDir: t.planByDir, factByDir: t.factByDir,
    inputs: JSON.parse(JSON.stringify(state.inputs)),
    plan: bakeFinalPlan(state.inputs, state.plan),
    fact: JSON.parse(JSON.stringify(state.fact)),
    routesPlan: rt.plan, routesFact: rt.fact,
    routes: JSON.parse(JSON.stringify(state.routes)),
  });
  state.monthCursor += 1;
  if (mIdx === 11) state.currentYear += 1;
  state.forecastInflow = defaultInflow();
  // новый месяц — все ячейки для заполнения пустые (нули)
  state.inputs = defaultInputsFor();
  state.plan = defaultPlanFor();
  state.fact = defaultFactFor();
  state.routes = resetRoutesForNewMonth(state.routes);
  state.capacitySelection = keepCapacitySelection(state.capacitySelection);
  state.distributionShares = keepDistributionShares(state.distributionShares);
  state.capacityTeu = keepCapacityTeu(state.capacityTeu);
  state.planningHorizon = keepPlanningHorizon(state.planningHorizon);
  saveAndRender();
}

// ---------- focus preservation ----------
function getFocusInfo(){
  const el = document.activeElement;
  if (!el || el.tagName !== "INPUT" || !el.dataset.key) return null;
  return { key: el.dataset.key, selStart: el.selectionStart, selEnd: el.selectionEnd };
}
function restoreFocus(info){
  if (!info) return;
  const el = document.querySelector('[data-key="'+info.key+'"]');
  if (el) { el.focus(); try { el.setSelectionRange(info.selStart, info.selEnd); } catch(e){} }
}

// ---------- render helpers ----------
function numField(key, value, handlerName, allowNeg){
  const clean = allowNeg
    ? "this.value=this.value.replace(/[^0-9\\-]/g,'').replace(/(?!^)-/g,'');"
    : "this.value=this.value.replace(/[^0-9]/g,'');";
  return '<div class="numfield"><input type="text" inputmode="numeric" pattern="[0-9\\-]*" data-key="'+key+'" value="'+
    (Number.isFinite(value)?value:0)+'" oninput="'+clean+' '+handlerName+'(this.value)" '+
    'onfocus="this.select()" onkeydown="handleCellNav(event)" /></div>';
}
function decimalField(key, value, handlerName){
  const clean = "this.value=this.value.replace(/,/g,'.').replace(/[^0-9.]/g,''); var p=this.value.split('.'); if(p.length>2) this.value=p[0]+'.'+p.slice(1).join('');";
  return '<div class="numfield"><input type="text" inputmode="decimal" pattern="[0-9,.]*" data-key="'+key+'" value="'+
    (value!==undefined&&value!==null?value:0)+'" oninput="'+clean+' '+handlerName+'(this.value)" '+
    'onfocus="this.select()" onkeydown="handleCellNav(event)" /></div>';
}
// навигация между ячейками как в Excel: стрелки и Enter переходят к
// соседней ячейке в той же таблице, новое значение сразу выделено —
// набор цифр заменяет старое, а не дописывается к нулю
function handleCellNav(e){
  const key = e.key;
  if (key!=="ArrowUp" && key!=="ArrowDown" && key!=="ArrowLeft" && key!=="ArrowRight" && key!=="Enter") return;
  const input = e.target;
  const table = input.closest("table");
  if (!table) return;
  const allInputs = Array.from(table.querySelectorAll("input"));
  const flatIdx = allInputs.indexOf(input);
  function go(el){ if (el){ e.preventDefault(); el.focus(); el.select(); } }
  if (key==="Enter" || key==="ArrowRight") { go(allInputs[flatIdx+1]); return; }
  if (key==="ArrowLeft") { go(allInputs[flatIdx-1]); return; }
  const tr = input.closest("tr");
  const rowInputs = Array.from(tr.querySelectorAll("input"));
  const colIdx = rowInputs.indexOf(input);
  const allRows = Array.from(table.querySelectorAll("tr")).filter(r=>r.querySelector("input"));
  const rowIdx = allRows.indexOf(tr);
  const targetRowIdx = key==="ArrowUp" ? rowIdx-1 : rowIdx+1;
  if (targetRowIdx<0 || targetRowIdx>=allRows.length) return;
  const targetInputs = Array.from(allRows[targetRowIdx].querySelectorAll("input"));
  go(targetInputs[colIdx] || targetInputs[targetInputs.length-1]);
}
function flowBarHtml(inputs, plan, loc){
  const i = inputs[loc.id];
  const resource = Math.max((effRes(i,"c20"))+(effRes(i,"c40")), 1);
  const normPct = Math.min(100, Math.max(0, (((i.norm20||0)+(i.norm40||0))/resource)*100));
  const volume = volumeForCtx(inputs, loc.id);
  let cursor = normPct;
  let segs = "";
  DIRECTIONS.forEach(d=>{
    const fin20 = finalPlan20For(inputs, plan, loc.id, d.key);
    const fin40 = finalPlan40For(inputs, plan, loc.id, d.key);
    const finTotal = fin20 + fin40;
    const w = resource>0 ? (finTotal/resource)*100 : 0;
    const pctOfVolume = volume>0 ? (finTotal/volume)*100 : 0;
    const tip = d.label+': 20\' — '+fmt(fin20)+' шт, 40\' — '+fmt(fin40)+' шт · '+Math.round(pctOfVolume)+'% от объёма';
    // не даём сегментам выйти за правый край полосы, если норма+планы
    // превышают ресурс локации
    const left = Math.min(100, cursor);
    const width = Math.max(0, Math.min(w, 100 - left));
    if (width > 0) {
      segs += '<div class="tip-wrap flowbar-seg" style="position:absolute;left:'+left+'%;width:'+width+'%;background:'+d.color+'">'+
        '<div class="tip">'+tip+'</div></div>';
    }
    cursor += w;
  });
  const planSum = DIRECTIONS.reduce((s,d)=>s+finalPlanForCtx(inputs,plan,loc.id,d.key),0);
  const unalloc = Math.max(0, volume - planSum);
  const unallocW = resource>0 ? (unalloc/resource)*100 : 0;
  const unallocLeft = normPct + (planSum/resource)*100;
  let unallocHtml = "";
  if (unallocW > 0.2) {
    const un20 = Math.max(0, volume20ForCtx(inputs,loc.id) - sumManualSizeForCtx(plan,loc.id,"c20") - DIRECTIONS.reduce((s,d)=>s+autoAddSizeForCtx(inputs,plan,loc.id,d.key,"c20"),0));
    const un40 = Math.max(0, volume40ForCtx(inputs,loc.id) - sumManualSizeForCtx(plan,loc.id,"c40") - DIRECTIONS.reduce((s,d)=>s+autoAddSizeForCtx(inputs,plan,loc.id,d.key,"c40"),0));
    const pctUn = volume>0 ? (unalloc/volume)*100 : 0;
    const tipUn = 'Не распределено: 20\' — '+fmt(un20)+' шт, 40\' — '+fmt(un40)+' шт · '+Math.round(pctUn)+'% от объёма';
    const uLeft = Math.min(100, unallocLeft);
    const uWidth = Math.max(0, Math.min(unallocW, 100 - uLeft));
    if (uWidth > 0) unallocHtml = '<div class="tip-wrap flowbar-seg flowbar-unalloc" style="position:absolute;left:'+uLeft+'%;width:'+uWidth+'%"><div class="tip">'+tipUn+'</div></div>';
  }
  // если норма + планы не помещаются в ресурс — помечаем правый край
  const overflows = cursor > 100.5;
  const overMark = overflows
    ? '<div class="tip-wrap" style="position:absolute;right:-1px;top:-3px;bottom:-3px;width:4px;background:var(--danger);border-radius:0 2px 2px 0">'+
      '<div class="tip">План и норма превышают ресурс на '+fmt((cursor-100)/100*resource)+' шт</div></div>'
    : '';
  return '<div class="flowbar">'+segs+unallocHtml+'<div class="flowbar-norm" style="left:'+normPct+'%"></div>'+overMark+'</div>';
}

// % сдачи по истории: факт подхода импорта / план за закрытые месяцы (по локации, 20'+40').
function autoAccFor(locId){
  let P=0,F=0;
  (state.archive||[]).forEach(a=>{ const i=a.inputs&&a.inputs[locId]; if(!i) return;
    const p=(i.imp20||0)+(i.imp40||0), f=(i.impF20||0)+(i.impF40||0);
    if (p>0 && f>0){ P+=p; F+=f; } });
  return P>0 ? Math.round(F/P*100) : null;
}
function refreshAutoAcc(){
  LOCATIONS.forEach(l=>{ const i=state.inputs[l.id]; const a=autoAccFor(l.id);
    if (a===null) i.accAuto=false; else { i.acc=a; i.accAuto=true; } });
}
function resCells(i){
  const f=(sz)=>{ const raw=(sz==="c20"?i.resource20:i.resource40)||0, pt=importParts(i,sz);
    return {full: raw+pt.plan, lost: Math.round(pt.notArrive+pt.fix-pt.okRep), ok: effRes(i,sz)}; };
  const a=f("c20"), b=f("c40");
  return '<td class="num-cell">20\': '+fmt(a.full)+'<br>40\': '+fmt(b.full)+'</td>'+
    '<td class="num-cell">20\': '+fmt(a.lost)+'<br>40\': '+fmt(b.lost)+'</td>'+
    '<td class="num-cell">20\': '+fmt(a.ok)+'<br>40\': '+fmt(b.ok)+'</td>';
}

    const locName = (CAPACITY_LOCATIONS.find(l=>l.id===r.loc)||{}).name || "не привязано";
    const limitBtn = '<button class="btn" style="padding:4px 10px;font-size:11.5px" onclick="toggleRouteLimit(\''+r.key+'\')">'+(rs.limited?"Лимитирующее":"Не лимитирующее")+'</button>';
    const shareSum = shareNum(rs.share40)+shareNum(rs.share20);
    const shareWarn = (shareSum>0 && Math.abs(shareSum-1)>0.01) ? '<div class="teu-hint" style="color:var(--danger)">сумма '+shareSum.toFixed(2)+', не 1</div>' : "";
    return '<tr><td class="loc-name">'+r.label+'<div class="loc-tag">'+locName+'</div></td>'+
      '<td>'+numField('rteu-'+r.key, rs.teuPerTrain, "hr_"+r.key+"_teuPerTrain")+'</td>'+
      '<td>'+numField('rplan-'+r.key, rs.plan, "hr_"+r.key+"_plan")+'</td>'+
      '<td>'+numField('rfact-'+r.key, rs.fact, "hr_"+r.key+"_fact")+'</td>'+
      '<td>'+rHtml+'</td>'+
      '<td>'+decimalField('rs40-'+r.key, rs.share40, "hr_"+r.key+"_share40")+'</td>'+
      '<td>'+decimalField('rs20-'+r.key, rs.share20, "hr_"+r.key+"_share20")+shareWarn+'</td>'+
      '<td>'+limitBtn+'</td></tr>';
  }).join("");
  const totalPlan = ROUTES.reduce((s,r)=>s+(state.routes[r.key].plan||0),0);
  const totalFact = ROUTES.reduce((s,r)=>s+(state.routes[r.key].fact||0),0);
  const totalRatio = pct(totalFact, totalPlan);
  const totalRatioHtml = totalRatio===null ? "—" : '<span class="'+(totalRatio>=1?"diff-ok":"diff-bad")+'">'+Math.round(totalRatio*100)+'%</span>';
  routeRows += '<tr class="total-row"><td>ИТОГО ПО НЗ</td><td></td><td class="num-cell">'+fmt(totalPlan)+'</td><td class="num-cell">'+fmt(totalFact)+'</td><td>'+totalRatioHtml+'</td><td></td><td></td><td></td></tr>';

  let capRows = CAPACITY_LOCATIONS.map(l=>{
    const trainsPlan = trainsPlanCountFor(l.id);
    const cap = trainsCapacityFor(l.id);
    const horizon = state.planningHorizon[l.id];
    const horizonNorm = cap / WEEKS_PER_MONTH * horizon;
    const horizonField = numField('horizon-'+l.id, horizon, "hh_"+l.id);
    const hasLoc = LOCATIONS.some(x=>x.id===l.id);
    if (!hasLoc) {
      // ВСБ — псевдо-локация: нет своих сток/подход и плана департаментов,
      // но горизонт и целевую норму под лимитные поезда посчитать можно
      const badge = trainsPlan===0 ? '<span class="badge">нет лимитных направлений</span>' : '<span class="badge">только вместимость</span>';
      return '<tr><td class="loc-name">'+l.name+'</td><td class="num-cell">'+fmt(trainsPlan)+'</td>'+
        '<td class="num-cell">'+fmt(cap)+' TEU</td><td class="muted">—</td>'+
        '<td>'+horizonField+'</td><td class="num-cell">'+fmt(horizonNorm)+' TEU</td>'+
        '<td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td>'+badge+'</td></tr>';
    }
    const resourceTeu = teu(effRes(state.inputs[l.id],"c20"), effRes(state.inputs[l.id],"c40"));
    const sel = state.capacitySelection[l.id];
    const teuOverride = state.capacityTeu[l.id];
    const chips = DIRECTIONS.map(d=>{
      const on = !!sel[d.key];
      const fullTeu = Math.round(finalPlanTeuFor(l.id,d.key));
      const displayVal = teuOverride[d.key]!==null ? teuOverride[d.key] : fullTeu;
      const style = on ? 'background:'+d.color+';border-color:'+d.color+';color:#fff' : 'border-color:'+d.color+';color:'+d.color;
      const chip = '<span class="dept-chip" style="'+style+'" title="'+d.label+'" onclick="toggleCapacityDept(\''+l.id+'\',\''+d.key+'\')">'+d.label+'</span>';
      const teuField = on ? numField('teuov-'+l.id+'-'+d.key, displayVal, "hs_"+l.id+"_"+d.key) : '<span class="muted" style="font-size:11px">—</span>';
      const hint = on ? '<span class="muted" style="font-size:10px;white-space:nowrap">из '+fmt(fullTeu)+'</span>' : '';
      return '<div style="display:grid;grid-template-columns:132px 70px auto;align-items:center;gap:6px;margin-bottom:4px">'+chip+teuField+hint+'</div>';
    }).join("");
    const combined = DIRECTIONS.reduce((s,d)=>{
      if (!sel[d.key]) return s;
      const ov = teuOverride[d.key];
      return s + (ov!==null ? ov : finalPlanTeuFor(l.id,d.key));
    }, 0);
    const normTeu = teu(state.inputs[l.id].norm20, state.inputs[l.id].norm40);
    const remainder = resourceTeu - normTeu - combined;
    const remainderHtml = '<span class="'+(remainder<0?"diff-bad":"diff-ok")+'">'+fmt(remainder)+' TEU</span>';
    const shortage = cap - combined;
    const shortageHtml = '<span class="'+(shortage<0?"diff-bad":"diff-ok")+'">'+fmt(shortage)+' TEU</span>';
    return '<tr><td class="loc-name">'+l.name+'</td><td class="num-cell">'+fmt(trainsPlan)+'</td>'+
      '<td class="num-cell">'+fmt(cap)+' TEU</td><td class="num-cell">'+fmt(resourceTeu)+' TEU</td>'+
      '<td>'+horizonField+' нед</td><td class="num-cell">'+fmt(horizonNorm)+' TEU</td>'+
      '<td>'+chips+'<div class="num-cell" style="margin-top:4px">'+fmt(combined)+' TEU</div></td>'+
      '<td class="num-cell">'+remainderHtml+'</td><td class="num-cell">'+shortageHtml+'</td><td></td></tr>';
  }).join("");

  return '<div class="panel"><p class="panel-title">Выполнение плана поездов по направлениям (НЗ)</p>'+
    '<p class="panel-sub">Доли 40\'/20\' — состав поезда (например 0,8 и 0,2). Лимитирующие направления формируют вместимость в таблице ниже.</p>'+
    '<table><thead><tr><th>Направление</th><th>TEU/поезд</th><th>План, шт</th><th>Факт, шт</th><th>% выполнения</th><th>Доля 40\'</th><th>Доля 20\'</th><th>Лимитирующее</th></tr></thead><tbody>'+routeRows+'</tbody></table></div>'+

    '<div class="panel"><p class="panel-title">Вместимость по локациям vs итоговый план</p>'+
    '<p class="panel-sub">Вместимость = поезда × TEU/поезд по лимитирующим направлениям. Целевая норма = вместимость ÷ '+WEEKS_PER_MONTH+' × горизонт (недель). Чипами выбираете, чьи планы учитывать; число рядом можно поправить. Остаток = Объём − Норма − План. Нехватка = Вместимость − План.</p>'+
    '<table><thead><tr><th>Локация</th><th>Лимитных поездов, шт</th><th>Вместимость</th><th>Общий объём ТЕУ</th><th>Горизонт</th><th>Целевая норма (горизонт)</th><th>Учитываемый план (клик — вкл/выкл)</th><th>Остаток к распределению</th><th>Нехватка вместимости</th><th></th></tr></thead><tbody>'+capRows+'</tbody></table></div>';
}

// set   — план, поставленный департаментами вручную
// final — итоговый план (поставленный + автодобор остатка)
function sizeMetricsCtx(inputs, plan, fact){
  const r = { c20:{res:0,surplus:0,set:0,final:0,fact:0}, c40:{res:0,surplus:0,set:0,final:0,fact:0} };
  LOCATIONS.forEach(l=>{
    const i = inputs[l.id];
    r.c20.res += effRes(i,"c20"); r.c40.res += effRes(i,"c40");
    r.c20.surplus += volume20ForCtx(inputs,l.id); r.c40.surplus += volume40ForCtx(inputs,l.id);
    DIRECTIONS.forEach(d=>{
      ["c20","c40"].forEach(sz=>{
        r[sz].set   += setSizeForCtx(plan,l.id,d.key,sz);
        r[sz].final += finalPlanSizeForCtx(inputs,plan,l.id,d.key,sz);
        r[sz].fact  += (fact[l.id][d.key][sz]||0);
      });
    });
  });
  return r;
}
const MONTH_IN = {"Январь":"январе","Февраль":"феврале","Март":"марте","Апрель":"апреле","Май":"мае","Июнь":"июне","Июль":"июле","Август":"августе","Сентябрь":"сентябре","Октябрь":"октябре","Ноябрь":"ноябре","Декабрь":"декабре"};
function monthIn(label){ return MONTH_IN[label] || label.toLowerCase(); }
const MONTH_OF = {"Январь":"января","Февраль":"февраля","Март":"марта","Апрель":"апреля","Май":"мая","Июнь":"июня","Июль":"июля","Август":"августа","Сентябрь":"сентября","Октябрь":"октября","Ноябрь":"ноября","Декабрь":"декабря"};
function monthOf(label){ return MONTH_OF[label] || label.toLowerCase(); }
// поставленный департаментами план: у закрытых месяцев хранится отдельно в plan.__set
function setSizeForCtx(plan, locId, deptKey, sz){
  if (plan && plan.__set) return (plan.__set[locId] && plan.__set[locId][deptKey] && plan.__set[locId][deptKey][sz]) || 0;
  return manualSizeForCtx(plan, locId, deptKey, sz);
}
// пояснение к блоку: «Что это» + «Как читать»
function expl(what, how){
  return '<div class="explain"><div><span class="ex-k">Что это</span><span>'+what+'</span></div>'+
         (how ? '<div><span class="ex-k">Как читать</span><span>'+how+'</span></div>' : '')+'</div>';
}
function pctTxt(a,b){ if(!b) return "—"; return Math.round(a/b*100)+"%"; }
function heatStyle(r){
  if (r===null) return 'color:var(--muted)';
  if (r>=1)   return 'background:#D4EBDF;color:#155C45';
  if (r>=0.8) return 'background:#E6F1D9;color:#3D5E1F';

// ---------- SVG-графики ----------
function niceMax(v){
  if (v<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  const m = n<=1?1: n<=2?2: n<=2.5?2.5: n<=5?5: 10;
  return m*p;
}
const CH = { W:600, H:240, L:48, R:44, T:18, B:34 };
function chartFrame(labels, yMax, yFmt, rightMax, rightFmt, steps){
  steps = steps || 4;
  const pw = CH.W-CH.L-CH.R, ph = CH.H-CH.T-CH.B;
  let g = "";
  for (let k=0;k<=steps;k++){
    const y = CH.T + ph - ph*k/steps;
    g += '<line x1="'+CH.L+'" y1="'+y+'" x2="'+(CH.W-CH.R)+'" y2="'+y+'" stroke="#E4EAF0" stroke-width="1"/>';
    g += '<text x="'+(CH.L-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#667889">'+yFmt(yMax*k/steps)+'</text>';
    if (rightMax!==undefined) g += '<text x="'+(CH.W-CH.R+6)+'" y="'+(y+3.5)+'" font-size="10" fill="#667889">'+rightFmt(rightMax*k/steps)+'</text>';
  }
  const gw = pw/labels.length;
  labels.forEach((lb,idx)=>{
    g += '<text x="'+(CH.L+gw*idx+gw/2)+'" y="'+(CH.H-12)+'" text-anchor="middle" font-size="11" font-weight="600" fill="#0E1B24">'+lb+'</text>';
  });
  return { g, pw, ph, gw };
}
function svgWrap(inner){
  return '<svg viewBox="0 0 '+CH.W+' '+CH.H+'" width="100%" style="display:block;font-family:Archivo,sans-serif">'+inner+'</svg>';
}
function svgBars(labels, series){
  const mx = niceMax(Math.max(1, ...series.flatMap(s=>s.values)));
  const f = chartFrame(labels, mx, v=>fmt(v));
  let out = f.g;
  const bw = Math.min(26, f.gw*0.72/series.length);
  labels.forEach((lb,idx)=>{
    const x0 = CH.L + f.gw*idx + (f.gw - bw*series.length)/2;
    series.forEach((s,si)=>{
      const v = s.values[idx]||0, h = f.ph*v/mx, x = x0+si*bw, y = CH.T+f.ph-h;
      out += '<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+h+'" rx="2" fill="'+s.color+'"><title>'+lb+' · '+s.name+': '+fmt(v)+' шт</title></rect>';
      out += '<text x="'+(x+(bw-2)/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="9" fill="#44586A">'+fmt(v)+'</text>';
    });
  });
  return svgWrap(out);
}
function svgLines(labels, series, showLabels){
  const vals = series.flatMap(s=>s.values).filter(v=>v!==null);
  let mx = Math.max(1, Math.ceil(Math.max(1, ...vals)*1.08*4)/4);
  let steps = Math.round(mx/0.25);
  if (steps>6){ mx = Math.ceil(mx*2)/2; steps = Math.round(mx/0.5); }
  const f = chartFrame(labels, mx, v=>Math.round(v*100)+"%", undefined, undefined, steps);
  let out = f.g;
  const y100 = CH.T + f.ph - f.ph*1/mx;
  out += '<line x1="'+CH.L+'" y1="'+y100+'" x2="'+(CH.W-CH.R)+'" y2="'+y100+'" stroke="#0E1B24" stroke-width="1" stroke-dasharray="4 3" opacity=".45"/>';
  series.forEach(s=>{
    let d = "", pen = false;
    s.values.forEach((v,idx)=>{
      if (v===null){ pen=false; return; }
      const x = CH.L + f.gw*idx + f.gw/2, y = CH.T + f.ph - f.ph*v/mx;
      d += (pen?" L":" M")+x+" "+y; pen = true;
    });
    out += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
    s.values.forEach((v,idx)=>{
      if (v===null) return;
      const x = CH.L + f.gw*idx + f.gw/2, y = CH.T + f.ph - f.ph*v/mx;
      out += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#fff" stroke="'+s.color+'" stroke-width="2"><title>'+labels[idx]+' · '+s.name+': '+Math.round(v*100)+'%</title></circle>';
      if (showLabels) out += '<text x="'+x+'" y="'+(y-9)+'" text-anchor="middle" font-size="9.5" font-weight="600" fill="'+s.color+'">'+Math.round(v*100)+'%</text>';
    });
  });
  return svgWrap(out);
}
function svgCombo(labels, bars, line){
  if (!Array.isArray(bars)) bars = [bars];
  const bvals = bars.flatMap(b=>b.values).filter(v=>v!==null);
  const mx = niceMax(Math.max(1, ...bvals));
  const lv = line.values.filter(v=>v!==null);
  const rmx = Math.max(1.2, Math.ceil(Math.max(1, ...lv)*1.08/0.4)*0.4);
  const f = chartFrame(labels, mx, v=>fmt(v), rmx, v=>Math.round(v*100)+"%");
  let out = f.g;
  const bw = Math.min(bars.length>1?24:34, f.gw*(bars.length>1?0.72:0.55)/bars.length);
  labels.forEach((lb,idx)=>{
    const x0 = CH.L+f.gw*idx+(f.gw-bw*bars.length)/2;
    const allNull = bars.every(b=>b.values[idx]===null);
    if (allNull){
      out += '<text x="'+(CH.L+f.gw*idx+f.gw/2)+'" y="'+(CH.T+f.ph-6)+'" text-anchor="middle" font-size="10" fill="#9AA8B6">н/д</text>';
      return;
    }
    bars.forEach((b,bi)=>{
      const v = b.values[idx]||0, h = f.ph*v/mx, x = x0+bi*bw, y = CH.T+f.ph-h;
      out += '<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+h+'" rx="2" fill="'+b.color+'"><title>'+lb+' · '+b.name+': '+fmt(v)+'</title></rect>';
      if (bars.length>1) out += '<text x="'+(x+(bw-2)/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="9" fill="#44586A">'+fmt(v)+'</text>';
    });
  });
  let d="", pen=false;
  line.values.forEach((v,idx)=>{
    if (v===null){ pen=false; return; }
    const x = CH.L+f.gw*idx+f.gw/2, y = CH.T+f.ph-f.ph*v/rmx;
    d += (pen?" L":" M")+x+" "+y; pen=true;
  });
  if (d) out += '<path d="'+d+'" fill="none" stroke="'+line.color+'" stroke-width="2.5"/>';
  line.values.forEach((v,idx)=>{
    if (v===null) return;
    const x = CH.L+f.gw*idx+f.gw/2, y = CH.T+f.ph-f.ph*v/rmx;
    out += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#fff" stroke="'+line.color+'" stroke-width="2"><title>'+labels[idx]+' · '+line.name+': '+Math.round(v*100)+'%</title></circle>';
    out += '<text x="'+x+'" y="'+(y-9)+'" text-anchor="middle" font-size="9.5" font-weight="600" fill="'+line.color+'">'+Math.round(v*100)+'%</text>';
  });
  return svgWrap(out);
}
function chartLegend(items){
  return '<div class="legend-row" style="margin-top:6px">'+items.map(it=>'<span class="legend-item"><span class="dot" style="background:'+it.color+'"></span>'+it.name+'</span>').join("")+'</div>';
}

function renderDashboardTab(ctx){
  ctx = ctx || { inputs: state.inputs, plan: state.plan, fact: state.fact, monthLabel: MONTH_NAMES[state.monthCursor%12], closable: true, routesTotal: routesTotals(state.routes), routesSnapshot: state.routes };
  const inputs = ctx.inputs, plan = ctx.plan, fact = ctx.fact, monthLabel = ctx.monthLabel;
  const t = totalsFullCtx(inputs, plan, fact);
  const overallPct = pct(t.totalFact, t.totalPlan);
  let worst=null;
  DIRECTIONS.forEach(d=>{
    const r = pct(t.factByDir[d.key], t.planByDir[d.key]);
    if (r===null) return;
    if (worst===null || r<worst.ratio) worst={label:d.label, ratio:r};
  });

  const kpi = '<div class="kpi-row">'+
    '<div class="kpi"><div class="kpi-label">Объём к эвакуации, шт</div><div class="kpi-value">'+fmt(t.totalVolume)+'</div><div class="kpi-hint">сколько нужно вывезти: сток + подход − норма</div></div>'+
    '<div class="kpi"><div class="kpi-label">План, шт</div><div class="kpi-value">'+fmt(t.totalPlan)+'</div><div class="kpi-hint">итоговый план всех департаментов</div></div>'+
    '<div class="kpi"><div class="kpi-label">Факт, шт</div><div class="kpi-value">'+fmt(t.totalFact)+'</div><div class="kpi-hint">сколько контейнеров вывезли</div></div>'+
    '<div class="kpi"><div class="kpi-label">% выполнения</div><div class="kpi-value" style="color:'+(overallPct>=1?"var(--ok)":"var(--danger)")+'">'+
    (t.totalPlan? Math.round(overallPct*100)+"%":"—")+'</div><div class="kpi-hint">факт ÷ план; 100% и выше — план выполнен</div></div></div>';

  let note = "";
  if (t.totalPlan>0 && t.totalFact===0) {
    note = '<div class="alert-card alert-info"><div class="alert-icon">i</div><div class="alert-body">'+
      '<div class="alert-kicker">Выполнение плана</div>'+
      '<div class="alert-title">Факт за '+monthLabel.toLowerCase()+' ещё не внесён</div>'+
      '<div class="alert-meta">Заполните «Факт выдачи» на вкладке «Распределение» — здесь появится департамент с самым низким выполнением.</div>'+
      '</div><div></div></div>';
  } else if (worst) {
    // по каждому департаменту: выполнение, недовывоз и две самые слабые локации
    const deptStat = d=>{
      const pl = t.planByDir[d.key], fc = t.factByDir[d.key];
      const locs = [];
      LOCATIONS.forEach(l=>{
        const p = finalPlanForCtx(inputs, plan, l.id, d.key);
        if (p <= 0) return;
        locs.push({ name:l.name, r: factCountForCtx(fact, l.id, d.key)/p, gap: Math.max(0, p - factCountForCtx(fact, l.id, d.key)) });
      });
      locs.sort((a,b)=>a.r-b.r);
      return { d, plan:pl, fact:fc, ratio: pl>0 ? fc/pl : null, gap: Math.max(0, pl-fc), weak: locs.filter(x=>x.r<1).slice(0,2) };
    };
    const stats = DIRECTIONS.map(deptStat).filter(x=>x.ratio!==null);
    const wd = DIRECTIONS.find(d=>d.label===worst.label);
    const W = stats.find(x=>x.d.key===wd.key);
    const others = stats.filter(x=>x.d.key!==wd.key).sort((a,b)=>a.ratio-b.ratio);
    const weakTxt = x=> x.weak.length
      ? 'хуже всего: '+x.weak.map(w=>'<b>'+w.name+'</b> — '+Math.round(w.r*100)+'%').join(', ')
      : 'план выполнен во всех локациях';
    const pctCls = worst.ratio>=1 ? "ok" : "bad";
    const otherCard = x=>{
      const cls = x.ratio>=1 ? 'diff-ok' : 'diff-bad';
      return '<div class="alert-other">'+
        '<div class="ao-head"><span class="dot" style="background:'+x.d.color+';width:10px;height:10px;margin-right:7px"></span>'+x.d.label+
          '<span class="ao-pct '+cls+'">'+Math.round(x.ratio*100)+'%</span></div>'+
        '<div class="alert-meta">'+(x.gap>0 ? 'недовывезено <b>'+fmt(x.gap)+'</b> шт из плана '+fmt(x.plan) : 'план выполнен: '+fmt(x.fact)+' из '+fmt(x.plan)+' шт')+'</div>'+
        '<div class="alert-meta">'+weakTxt(x)+'</div>'+
      '</div>';
    };
    note = '<div class="alert-card alert-'+pctCls+'">'+
      '<div class="alert-icon">'+(worst.ratio>=1 ? "&#10003;" : "!")+'</div>'+
      '<div class="alert-body">'+
        '<div class="alert-kicker">'+(worst.ratio>=1 ? "Все департаменты выполнили план · наименьший результат" : "Слабее всех выполняет план в "+monthIn(monthLabel))+'</div>'+
        '<div class="alert-title"><span class="dot" style="background:'+wd.color+';width:12px;height:12px;margin-right:9px"></span>'+wd.label+'</div>'+
        '<div class="alert-meta">'+
          (W.gap>0 ? 'недовывезено <b>'+fmt(W.gap)+'</b> шт из плана '+fmt(W.plan) : 'вывезено '+fmt(W.fact)+' шт при плане '+fmt(W.plan))+
          ' · '+weakTxt(W)+
        '</div>'+
      '</div>'+
      '<div class="alert-value">'+Math.round(worst.ratio*100)+'%<span>выполнение</span></div>'+
      (others.length ? '<div class="alert-others"><div class="ao-title">Остальные департаменты</div><div class="ao-grid">'+others.map(otherCard).join("")+'</div></div>' : '')+
    '</div>';
  }


  const deptKpi = '<div class="dept-kpi-row">'+DIRECTIONS.map(d=>{
      const p = t.planByDir[d.key], f = t.factByDir[d.key], r = pct(f,p);
      const rTxt = r===null ? "—" : Math.round(r*100)+"%";
      const rColor = r===null ? "var(--ink)" : (r>=1 ? "var(--ok)" : "var(--danger)");
      return '<div class="dept-kpi"><div class="dept-kpi-bar" style="background:'+d.color+'"></div>'+
        '<div class="dept-kpi-label">'+d.label+'</div>'+
        '<div class="dept-kpi-value" style="color:'+rColor+'">'+rTxt+'</div>'+
        '<div class="dept-kpi-sub">'+fmt(f)+' из '+fmt(p)+' шт</div></div>';
    }).join("")+'</div>';

  const maxVal = Math.max(1, ...DIRECTIONS.map(d=>Math.max(t.planByDir[d.key], t.factByDir[d.key])));
  const bars = '<div class="bars-wrap">'+DIRECTIONS.map(d=>{
    const ph = Math.max(2, Math.round((t.planByDir[d.key]/maxVal)*180));
    const fh = Math.max(2, Math.round((t.factByDir[d.key]/maxVal)*180));
    const r = pct(t.factByDir[d.key], t.planByDir[d.key]);
    const rTxt = r===null ? "—" : Math.round(r*100)+"%";
    return '<div class="bar-group"><div class="bar-pair">'+
      '<div class="tip-wrap" style="height:'+ph+'px;width:22px"><div class="bar bar-plan" style="height:100%"></div><div class="tip">План: '+fmt(t.planByDir[d.key])+' шт</div></div>'+
      '<div class="tip-wrap" style="height:'+fh+'px;width:22px"><div class="bar bar-fact" style="height:100%"></div><div class="tip">Факт: '+fmt(t.factByDir[d.key])+' шт · '+rTxt+' от плана</div></div>'+
      '</div><div class="bar-label">'+d.label+'</div></div>';
  }).join("")+'</div>'+
  '<div class="legend-row" style="margin-top:14px"><span class="legend-item"><span class="dot" style="background:#B9C7D4"></span>План</span>'+
  '<span class="legend-item"><span class="dot" style="background:#004D77"></span>Факт</span></div>';

  const contribRows = DIRECTIONS.map(d=>{
    const totalPlanDept = t.planByDir[d.key];
    const overallR = pct(t.factByDir[d.key], totalPlanDept);
    const overallTxt = overallR===null ? "—" : Math.round(overallR*100)+"%";
    const barMax = Math.max(100, (overallR||0)*100*1.05, 10);
    let cursor = 0, segs = "";
    LOCATIONS.forEach(l=>{
      const factLoc = factCountForCtx(fact, l.id, d.key);
      const planLoc = finalPlanForCtx(inputs, plan, l.id, d.key);
      const contribPP = totalPlanDept>0 ? (factLoc/totalPlanDept)*100 : 0;
      const locR = pct(factLoc, planLoc);
      const locTxt = locR===null ? "—" : Math.round(locR*100)+"%";
      const w = (contribPP/barMax)*100;
      if (contribPP > 0.05) {
        segs += '<div class="tip-wrap contrib-seg" style="left:'+cursor+'%;width:'+w+'%;background:'+l.color+'">'+
          '<div class="tip">'+l.name+': '+locTxt+' от своего плана · вклад '+contribPP.toFixed(1)+' п.п.</div></div>';
      }
      cursor += w;
    });
    const markerPos = (100/barMax)*100;
    return '<div style="display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:14px;margin-bottom:22px">'+
      '<span style="font-size:12.5px;font-weight:600">'+d.label+'</span>'+
      '<div class="contrib-bar">'+segs+'<div class="contrib-100" style="left:'+markerPos+'%"></div></div>'+
      '<span class="mono" style="font-size:12px;text-align:right">'+overallTxt+'</span></div>';
  }).join("");
  const contribLegend = '<div class="legend-row">'+LOCATIONS.map(l=>'<span class="legend-item"><span class="dot" style="background:'+l.color+'"></span>'+l.name+'</span>').join("")+'</div>';

  // ---- (3) постановка плана к стоку по футовости ----
  const sm = sizeMetricsCtx(inputs, plan, fact);
  const evacCard = (title, m)=>{
    const ev = m.surplus>0 ? m.fact/m.surplus : null;
    const left = m.surplus - m.fact;
    const rs = m.res>0 ? m.set/m.res : null;
    const cls = ev===null ? "" : (ev>=1 ? "diff-ok" : "diff-bad");
    return '<div class="dept-kpi"><div class="dept-kpi-bar" style="background:var(--brand)"></div>'+
      '<div class="dept-kpi-label">'+title+'</div>'+
      '<div style="display:flex;gap:34px;align-items:baseline;flex-wrap:wrap">'+
        '<div><div class="dept-kpi-value '+cls+'">'+(ev===null?'—':Math.round(ev*100)+'%')+'</div><div class="kpi-hint">вывезено от излишка</div></div>'+
        '<div><div class="dept-kpi-value '+(left>0?'diff-bad':'diff-ok')+'">'+fmt(Math.max(0,left))+' <span style="font-size:13px;font-weight:600;color:var(--muted)">шт</span></div>'+
          '<div class="kpi-hint">'+(left<0 ? 'осталось сверх нормы — нет, вывезли и ниже нормы на '+fmt(-left)+' шт' : 'осталось на площадках сверх нормы')+'</div></div>'+
      '</div>'+
      '<div class="dept-kpi-sub" style="margin-top:10px">сток '+fmt(m.res)+' · излишек '+fmt(m.surplus)+' · вывезено '+fmt(m.fact)+' · в плане '+(rs===null?'—':Math.round(rs*100)+'%')+' стока</div></div>';
  };
  const stockPanel = '<div class="panel"><p class="panel-title">Эвакуация излишка</p>'+
    expl('излишек — контейнеры сверх нормы, которые нужно было вывезти (сток + подход − норма). Здесь — какую часть излишка реально вывезли и сколько осталось, отдельно по 20\' и 40\'.',
         '100% и выше — весь излишек вывезен. Меньше 100% — часть осталась: сколько именно, показано справа в штуках. В нижней строке — исходные цифры и какую долю всего стока департаменты поставили в план.')+
    '<div class="dept-kpi-row" style="grid-template-columns:repeat(2,1fr)">'+evacCard("20-футовые", sm.c20)+evacCard("40-футовые", sm.c40)+'</div></div>';

  // ---- (6) матрица: локации × департамент × футовость ----
  const mHead1 = '<tr><th rowspan="2">Локация</th>'+DIRECTIONS.map(d=>'<th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)"><span class="dot" style="background:'+d.color+';margin-right:5px"></span>'+d.label+'</th>').join("")+'<th rowspan="2" style="text-align:center">Итого</th></tr>';
  const mHead2 = '<tr>'+DIRECTIONS.map(()=>'<th style="text-align:center">20\'</th><th style="text-align:center">40\'</th>').join("")+'</tr>';
  const colTot = {}; DIRECTIONS.forEach(d=>{ colTot[d.key]={c20:{p:0,f:0},c40:{p:0,f:0}}; });
  let allP=0, allF=0;
  const cell = (f,p)=>{
    const r = p>0 ? f/p : null;
    return '<td class="num-cell" style="text-align:center;'+heatStyle(r)+'" title="факт '+fmt(f)+' из плана '+fmt(p)+'">'+(r===null?"—":Math.round(r*100)+"%")+'</td>';
  };
  let mRows = LOCATIONS.map(l=>{
    let rowP=0,rowF=0;
    const cells = DIRECTIONS.map(d=>["c20","c40"].map(sz=>{
      const p = finalPlanSizeForCtx(inputs,plan,l.id,d.key,sz), f = fact[l.id][d.key][sz]||0;
      colTot[d.key][sz].p+=p; colTot[d.key][sz].f+=f; rowP+=p; rowF+=f;
      return cell(f,p);
    }).join("")).join("");
    allP+=rowP; allF+=rowF;
    return '<tr><td class="loc-name">'+l.name+'</td>'+cells+cell(rowF,rowP)+'</tr>';
  }).join("");
  mRows += '<tr class="total-row"><td>Итого</td>'+DIRECTIONS.map(d=>["c20","c40"].map(sz=>cell(colTot[d.key][sz].f,colTot[d.key][sz].p)).join("")).join("")+cell(allF,allP)+'</tr>';
  const matrixPanel = '<div class="panel"><p class="panel-title">Выполнение плана: локации × департаменты × футовость</p>'+
    expl('процент выполнения плана в разрезе «локация × департамент × 20\'/40\'» — показывает, где именно не вывезли.',
          'красный — ниже 50%, жёлтый — 50–80%, зелёный — от 80%, «—» — плана не было. Справа — итог по локации, внизу — по департаменту. Наведите на клетку — факт и план в штуках.')+
    '<table><thead>'+mHead1+mHead2+'</thead><tbody>'+mRows+'</tbody></table></div>';

  // ---- доли департаментов в выполнении: факт департамента ÷ весь план локации (как «Доля …» в листе DATA) ----
  const shTot = {c20:{p:0,f:{}}, c40:{p:0,f:{}}};
  ["c20","c40"].forEach(sz=>DIRECTIONS.forEach(d=>shTot[sz].f[d.key]=0));
  const shareRow = (name, sz, P, F, first, isTotal)=>{
    const tot = DIRECTIONS.reduce((a,d)=>a+F[d.key],0);
    const totR = P>0 ? tot/P : null;
    const barMax = Math.max(1, totR||0);
    let cursor = 0, segs = "";
    DIRECTIONS.forEach(d=>{
      const sh = P>0 ? F[d.key]/P : 0;
      const w = sh/barMax*100;
      if (w>0.3) segs += '<div class="tip-wrap contrib-seg" style="left:'+cursor+'%;width:'+w+'%;background:'+d.color+'"><div class="tip">'+d.label+': '+Math.round(sh*100)+'% · вывезено '+fmt(F[d.key])+' шт</div></div>';
      cursor += w;
    });
    const cells = DIRECTIONS.map(d=>{
      const sh = P>0 ? F[d.key]/P : null;
      return '<td class="num-cell" style="text-align:center" title="вывезено '+fmt(F[d.key])+' шт из общего плана локации '+fmt(P)+'">'+(sh===null?'—':(Math.round(sh*1000)/10).toLocaleString("ru-RU")+'%')+'</td>';
    }).join("");
    return '<tr'+(isTotal?' class="total-row"':'')+'>'+(first?'<td class="loc-name" rowspan="2" style="vertical-align:middle">'+name+'</td>':'')+
      '<td class="muted" style="font-weight:600">'+(sz==="c20"?"20'":"40'")+'</td>'+cells+
      '<td class="num-cell" style="text-align:center;font-weight:700;'+heatStyle(totR)+'">'+(totR===null?'—':Math.round(totR*100)+'%')+'</td>'+
      '<td style="min-width:180px"><div class="contrib-bar" style="height:14px">'+segs+'<div class="contrib-100" style="left:'+(100/barMax)+'%"></div></div></td></tr>';
  };
  let shRows = "";
  LOCATIONS.forEach(l=>{
    const per = {};
    ["c20","c40"].forEach(sz=>{
      const P = DIRECTIONS.reduce((a,d)=>a+finalPlanSizeForCtx(inputs,plan,l.id,d.key,sz),0);
      const F = {}; DIRECTIONS.forEach(d=>{ F[d.key] = fact[l.id][d.key][sz]||0; });
      per[sz] = {P,F};
      shTot[sz].p += P; DIRECTIONS.forEach(d=>shTot[sz].f[d.key]+=F[d.key]);
    });
    if (per.c20.P<=0 && per.c40.P<=0) return;
    shRows += shareRow(l.name,"c20",per.c20.P,per.c20.F,true,false) + shareRow(l.name,"c40",per.c40.P,per.c40.F,false,false);
  });
  shRows += shareRow("Итого","c20",shTot.c20.p,shTot.c20.f,true,true) + shareRow("Итого","c40",shTot.c40.p,shTot.c40.f,false,true);
  const sharesPanel = '<div class="panel panel-flow"><p class="panel-title">Доли департаментов в выполнении — по локациям и футовости</p>'+
    expl('как выполнение плана каждой локации раскладывается по департаментам. Доля = факт департамента ÷ весь план локации (всех трёх департаментов), отдельно 20\' и 40\' — так же, как «Доля …» в вашей таблице DATA.',
         'сумма долей = общий процент выполнения локации (колонка «Итого»). На полосе цветные отрезки — доли департаментов, чёрная метка — 100%: не дотягивает до метки — локация недовывезла, и видно, за чей счёт. Наведите на отрезок или ячейку — штуки.')+
    '<div style="overflow-x:auto"><table><thead><tr><th>Локация</th><th></th>'+
    DIRECTIONS.map(d=>'<th style="text-align:center"><span class="dot" style="background:'+d.color+';margin-right:5px"></span>'+d.label+'</th>').join("")+
    '<th style="text-align:center">Итого</th><th>Доли на полосе</th></tr></thead><tbody>'+shRows+'</tbody></table></div></div>';

  // ---- (4) локации × футовость — только проценты ----
  const tAcc = {c20:{res:0,sur:0,set:0,fin:0,fact:0}, c40:{res:0,sur:0,set:0,fin:0,fact:0}};
  const pc = (num, den, kind, tip)=>{
    const r = den>0 ? num/den : null;
    let st = "";
    if (kind==="sur" && r!==null) st = r>=1 ? "color:var(--ok);font-weight:700" : "color:var(--danger);font-weight:700";
    if (kind==="exec") st = heatStyle(r)+";font-weight:700";
    return '<td class="num-cell" style="text-align:center;'+st+'" title="'+tip+'">'+(r===null?"—":Math.round(r*100)+"%")+'</td>';
  };
  const rowCells = (v)=> ["c20","c40"].map(sz=>pc(v[sz].set, v[sz].res, "stock", "поставлено "+fmt(v[sz].set)+" из стока "+fmt(v[sz].res))).join("")+
                         ["c20","c40"].map(sz=>pc(v[sz].fact, v[sz].sur, "sur", "вывезено "+fmt(v[sz].fact)+" из излишка "+fmt(v[sz].sur)+" · осталось сверх нормы "+fmt(Math.max(0,v[sz].sur-v[sz].fact)))).join("")+
                         ["c20","c40"].map(sz=>pc(v[sz].fact, v[sz].fin, "exec", "факт "+fmt(v[sz].fact)+" из плана "+fmt(v[sz].fin))).join("");
  let tRows = LOCATIONS.map(l=>{
    const i = inputs[l.id], v = {};
    ["c20","c40"].forEach(sz=>{
      v[sz] = {
        res: sz==="c20" ? (effRes(i,"c20")) : (effRes(i,"c40")),
        sur: sz==="c20" ? volume20ForCtx(inputs,l.id) : volume40ForCtx(inputs,l.id),
        set: DIRECTIONS.reduce((a,d)=>a+setSizeForCtx(plan,l.id,d.key,sz),0),
        fin: DIRECTIONS.reduce((a,d)=>a+finalPlanSizeForCtx(inputs,plan,l.id,d.key,sz),0),
        fact: DIRECTIONS.reduce((a,d)=>a+(fact[l.id][d.key][sz]||0),0),
      };
      Object.keys(v[sz]).forEach(k=>tAcc[sz][k]+=v[sz][k]);
    });
    return '<tr><td class="loc-name">'+l.name+'</td>'+rowCells(v)+'</tr>';
  }).join("");
  tRows += '<tr class="total-row"><td>Итого</td>'+rowCells(tAcc)+'</tr>';
  const grp = (t)=>'<th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)">'+t+'</th>';
  const sub = '<th style="text-align:center">20\'</th><th style="text-align:center">40\'</th>';
  const locTable = '<div class="panel"><p class="panel-title">Локации по футовости</p>'+
    expl('по каждой локации отдельно для 20\' и 40\': насколько план покрыл сток, сколько вывезено от излишка и как выполнен план.',
          '«План к стоку» — какую долю всех контейнеров на площадке департаменты поставили в план. «Вывезено от излишка» — зелёный от 100%: всё сверх нормы вывезли, красный — часть осталась. «Выполнение плана» — факт ÷ план, цветом как в матрице выше. Наведите на ячейку — штуки.')+
    '<table><thead><tr><th rowspan="2">Локация</th>'+grp("План к стоку")+grp("Вывезено от излишка")+grp("Выполнение плана")+'</tr>'+
    '<tr>'+sub+sub+sub+'</tr></thead><tbody>'+tRows+'</tbody></table></div>';

  const closeBtn = ctx.closable ? (
    '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div><p class="panel-title" style="margin-bottom:2px">Закрыть '+monthLabel.toLowerCase()+'</p>'+
    '<p class="panel-sub" style="margin-bottom:0">В архив сохранится итоговый план — вписанный департаментами плюс распределённый излишек (как в разделе 2 «Распределения»). Следующий месяц откроется пустым.</p></div>'+
    '<button class="btn btn-primary" onclick="closeMonth()">Закрыть месяц &#8250;</button></div></div>'
  ) : "";

  let trainsPanel = "";
  if (ctx.routesTotal) {
    const rt = ctx.routesTotal;
    const rRatio = pct(rt.fact, rt.plan);
    const rRatioTxt = rRatio===null ? "—" : Math.round(rRatio*100)+"%";
    const rColor = rRatio===null ? "var(--ink)" : (rRatio>=1 ? "var(--ok)" : "var(--danger)");
    const breakdown = routesBreakdownHtml(ctx.routesSnapshot);
    trainsPanel = '<div class="panel">'+
      '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">'+
      '<div><p class="panel-title">Поезда (НЗ)</p><p class="panel-sub" style="margin:0">'+monthLabel+': отправлено / запланировано поездов</p></div>'+
      '<div style="display:flex;align-items:baseline;gap:18px">'+
      '<span class="mono muted" style="font-size:12.5px">'+fmt(rt.fact)+' / '+fmt(rt.plan)+' шт</span>'+
      '<span style="font-size:22px;font-weight:600;letter-spacing:-.02em;color:'+rColor+'">'+rRatioTxt+'</span>'+
      '</div></div>'+
      expl('сколько поездов по направлениям НЗ запланировали и сколько отправили. Справа вверху — итого и процент выполнения.',
           'в списке по каждому направлению: серая полоска — план, синяя — факт, справа «план / факт · %». Синяя короче серой — поездов отправили меньше плана.')+
      (breakdown ? '<div style="margin-top:18px"><p class="panel-title" style="font-size:13px;margin-bottom:10px">Разбивка по направлениям</p>'+
        '<div class="legend-row" style="margin-bottom:12px"><span class="legend-item"><span class="dot" style="background:#B9C7D4"></span>План</span>'+
        '<span class="legend-item"><span class="dot" style="background:#004D77"></span>Факт</span></div>'+
        breakdown+'</div>' : '')+
      '</div>';
  }

  return kpi + note +
    '<div class="panel"><p class="panel-title">По департаментам</p>'+expl('сколько контейнеров каждый департамент вывез из запланированного за '+monthLabel.toLowerCase()+'.',
          'в карточке — процент выполнения и «вывезено из плана» в штуках: зелёный — план выполнен, красный — нет. На столбцах серый — план, синий — факт; синий ниже серого — недовывоз. Наведите на столбец — точные числа.')+
    deptKpi+'<div style="margin-top:18px">'+bars+'</div></div>'+
    stockPanel+
    matrixPanel+
    sharesPanel+
    locTable+
    trainsPanel+
    '<div class="panel panel-flow"><p class="panel-title">Вклад локаций в выполнение (средневзвешенный %)</p>'+
    expl('из чего складывается процент выполнения департамента: сколько процентных пунктов (п.п.) дала каждая локация.',
          'длина цветного отрезка — вклад локации, вся цветная часть — итоговый процент департамента, чёрная метка — 100%. Цветная часть не дотягивает до метки — план не выполнен. Наведите на отрезок — локация, её собственный процент и вклад.')+
    contribRows+contribLegend+'</div>'+
    closeBtn;
}

function archHandler(name, fn){ window[name] = fn; return name; }
function renderArchiveEditForm(idx, a){
  const inputRows = LOCATIONS.map(l=>{
    const i = a.inputs[l.id];
    const hn = (field)=> archHandler('hA'+idx+'_'+l.id+'_'+field, (v)=> setArchiveInputField(idx, l.id, field, v));
    return '<tr><td class="loc-name">'+l.name+'</td>'+
      '<td>'+numField('aedit-'+idx+'-res20-'+l.id, i.resource20, hn('resource20'))+'</td>'+
      '<td>'+numField('aedit-'+idx+'-res40-'+l.id, i.resource40, hn('resource40'))+'</td>'+
      '<td>'+numField('aedit-'+idx+'-norm20-'+l.id, i.norm20, hn('norm20'), true)+'</td>'+

  // итоги по департаментам: план (с разбивкой «вписано + из излишка») и факт

  const planTotRow = '<tr class="total-row"><td>Итого</td>'+DIRECTIONS.map(d=>{

    }

  const factTotRow = '<tr class="total-row"><td>Итого</td>'+DIRECTIONS.map(d=>{

  const factRows = LOCATIONS.map(l=>{

      return '<td><div class="cell-pair">'+

  let trainsBlock = "";
  if (a.routes) {

      const preP = archHandler('hAR'+idx+'_'+r.key+'_plan', (v)=> setArchiveRouteField(idx, r.key, 'plan', v));

    trainsBlock = '<p class="panel-title" style="font-size:13px;margin-top:18px">Поезда (НЗ)</p>'+

  } else {
    trainsBlock = '<p class="muted" style="font-size:12px;margin-top:18px">Для этого месяца нет снимка данных по поездам — редактирование недоступно.</p>';
  }

  return '<div class="section-note" style="margin-bottom:16px">Правки касаются только месяца «'+a.label+'». План учитывается ровно таким, как вписан — без автораспределения остатка, процент выполнения = факт ÷ вписанный план.</div>'+
    '<p class="panel-title" style="font-size:13px">Ресурс и норма</p>'+
    '<table style="margin-bottom:18px"><thead><tr><th>Локация</th><th>Ресурс 20\'</th><th>Ресурс 40\'</th><th>Норма 20\'</th><th>Норма 40\'</th><th>План подхода 20\'</th><th>План подхода 40\'</th><th>Факт подхода 20\'</th><th>Факт подхода 40\'</th></tr></thead><tbody>'+inputRows+'</tbody></table>'+
    '<p class="panel-title" style="font-size:13px">План по департаментам — итоговый, с распределённым излишком</p>'+
    '<p class="panel-sub">Цифра в поле — это весь план департамента, излишек в неё уже включён. Вписываете новую — она и становится планом, сверху ничего не добавляется.</p>'+

    '<p class="panel-title" style="font-size:13px">Факт по департаментам</p>'+
